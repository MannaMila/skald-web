const ROMAN=['','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX','XXI','XXII','XXIII','XXIV'];
let scale=1,x=0,y=0,gesture=null,moved=false,anim=null;
const pointers=new Map();
let detailView=null,detailGesture=null;
const detailPointers=new Map();
let detailEngagement={zoom:false,pan:false};
const clamp=(value,minimum,maximum)=>Math.min(maximum,Math.max(minimum,value));

/* Viewport helpers: on mobile the layout viewport can be taller than what the
   browser actually shows, so measure through visualViewport where available. */
const vv=window.visualViewport;
/* Ignore visualViewport while the user is pinch-zooming the page itself. */
const vvUsable=()=>vv&&Math.abs((vv.scale||1)-1)<.01;
const VW=()=>vvUsable()?vv.width:innerWidth;
const VH=()=>vvUsable()?vv.height:innerHeight;
const isPhone=()=>matchMedia('(max-width:600px)').matches;
/* Desktop keeps its original 58/62px chrome budget so the fit is byte-identical. */
const topbarEl=document.getElementById('topbar');
const insets=()=>isPhone()?{top:(topbarEl.offsetHeight||52)+2,bottom:78}:{top:58,bottom:62};
function syncViewportVar(){
 document.documentElement.style.setProperty('--vh',VH()+'px');
}
const tileImgs=[...atlas.querySelectorAll('img[data-src]')];

/* Hi-res tiles load on demand: the 4096px overview serves the zoomed-out view;
   a tile fetches only when it intersects the viewport at readable zoom. */
const HIRES_SCALE=0.16;
function loadTile(i){
 const img=tileImgs[i];
 if(img.dataset.src){img.src=img.dataset.src;delete img.dataset.src}
 return img.complete?Promise.resolve():new Promise(res=>{img.onload=img.onerror=res});
}
function loadVisibleTiles(){
 if(scale<HIRES_SCALE)return;
 const vx0=(-x)/scale,vy0=(-y)/scale,vx1=(innerWidth-x)/scale,vy1=(innerHeight-y)/scale;
 const m=600;
 data.tiles.forEach((t,i)=>{
  if(t.x<vx1+m&&t.x+t.width>vx0-m&&t.y<vy1+m&&t.y+t.height>vy0-m)loadTile(i);
 });
}
function ensureTilesFor(rect){
 const jobs=[];
 data.tiles.forEach((t,i)=>{
  if(t.x<rect.x+rect.width&&t.x+t.width>rect.x&&t.y<rect.y+rect.height&&t.y+t.height>rect.y)
   jobs.push(loadTile(i));
 });
 return Promise.all(jobs);
}
function apply(){atlas.style.transform=`translate(${x}px,${y}px) scale(${scale})`;loadVisibleTiles()}
function fit(){cancelAnim();syncViewportVar();
 const ins=insets(),vw=VW(),avail=VH()-ins.top-ins.bottom;
 scale=Math.min(vw/data.width,avail/data.height)*.97;
 x=(vw-data.width*scale)/2;y=ins.top+(avail-data.height*scale)/2;apply();setActiveBook(null)}
function zoomAt(next,cx,cy){cancelAnim();next=Math.max(.03,Math.min(4,next));
 const ix=(cx-x)/scale,iy=(cy-y)/scale;x=cx-ix*next;y=cy-iy*next;scale=next;apply()}
function cancelAnim(){if(anim){cancelAnimationFrame(anim);anim=null}}
function flyTo(tx,ty,ts,done){cancelAnim();
 const sx=x,sy=y,ss=scale,t0=performance.now(),dur=650;
 function step(now){const t=Math.min(1,(now-t0)/dur),e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  x=sx+(tx-sx)*e;y=sy+(ty-sy)*e;scale=ss+(ts-ss)*e;apply();
  if(t<1)anim=requestAnimationFrame(step);else{anim=null;if(done)done()}}
 anim=requestAnimationFrame(step)}
function flyToGroup(g){
 const phone=isPhone(),pad=phone?14:90,ins=insets();
 const vw=VW(),avail=VH()-ins.top-ins.bottom-(phone?16:70);
 const ts=Math.min((vw-2*pad)/g.width,avail/g.height,1.1);
 const tx=(vw-g.width*ts)/2-g.x*ts;
 const ty=ins.top+(phone?8:12)+(avail-g.height*ts)/2-g.y*ts;
 flyTo(tx,ty,ts);
 groupBox.style.display='block';
 groupBox.style.left=(g.x-6)+'px';groupBox.style.top=(g.y-6)+'px';
 groupBox.style.width=(g.width+12)+'px';groupBox.style.height=(g.height+12)+'px';
 clearTimeout(groupBox._t);groupBox._t=setTimeout(()=>groupBox.style.display='none',2400);
}

/* ---------- book rail ---------- */
const phaseNames={1:'Telemachy',2:'Wanderings',3:'Homecoming'};
let lastPhase=null;
for(const g of data.groups){
 if(g.book===null)continue;
 if(g.phase!==lastPhase){
  if(lastPhase!==null){const sep=document.createElement('span');sep.className='phase-sep';rail.appendChild(sep)}
  const lb=document.createElement('span');lb.className='phase-label';lb.textContent=phaseNames[g.phase]||'';rail.appendChild(lb);
  lastPhase=g.phase;
 }
 const b=document.createElement('button');b.className='bk';b.textContent=g.roman;b.dataset.book=g.book;
 b.title=`Book ${g.roman} · ${g.title} · ${g.count} works`;
 b.onclick=()=>{setActiveBook(g.book);flyToGroup(g);
  track('select_book',{book:g.book,book_roman:g.roman,book_title:g.title})};
 rail.appendChild(b);
}
function setActiveBook(book){
 rail.querySelectorAll('.bk').forEach(b=>b.classList.toggle('active',book!==null&&+b.dataset.book===book));
}

/* ---------- pan/zoom ---------- */
stage.addEventListener('wheel',e=>{e.preventDefault();zoomAt(scale*Math.exp(-e.deltaY*.0015),e.clientX,e.clientY)},{passive:false});
stage.addEventListener('pointerdown',e=>{
 stage.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});startGesture();stage.classList.add('dragging')});
function startGesture(){
 const pts=[...pointers.values()];moved=false;cancelAnim();
 if(pts.length===1)gesture={type:'pan',px:pts[0].x,py:pts[0].y,x,y};
 else if(pts.length>=2){const[a,b]=pts;gesture={type:'pinch',distance:Math.hypot(b.x-a.x,b.y-a.y),cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,scale,x,y}}}
stage.addEventListener('pointermove',e=>{
 if(pointers.has(e.pointerId)&&gesture){
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const pts=[...pointers.values()];
  if(gesture.type==='pan'&&pts.length===1){
   const dx=pts[0].x-gesture.px,dy=pts[0].y-gesture.py;
   moved=moved||Math.hypot(dx,dy)>5;x=gesture.x+dx;y=gesture.y+dy;apply();
  }else if(gesture.type==='pinch'&&pts.length>=2){
   const[a,b]=pts,cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;
   const next=Math.max(.03,Math.min(4,gesture.scale*Math.hypot(b.x-a.x,b.y-a.y)/gesture.distance));
   const ix=(gesture.cx-gesture.x)/gesture.scale,iy=(gesture.cy-gesture.y)/gesture.scale;
   x=cx-ix*next;y=cy-iy*next;scale=next;moved=true;apply();
  }
 }
 updateHover(e);
});
function endPointer(e){pointers.delete(e.pointerId);if(pointers.size)startGesture();else{gesture=null;stage.classList.remove('dragging')}}
stage.addEventListener('pointerup',endPointer);stage.addEventListener('pointercancel',endPointer);

function atlasPoint(e){return{ax:(e.clientX-x)/scale,ay:(e.clientY-y)/scale}}
function workAt(ax,ay){return data.artworks.find(v=>ax>=v.x&&ax<v.x+v.width&&ay>=v.y&&ay<v.y+v.height)}
function updateHover(e){
 if(modal.classList.contains('open')){hoverBox.style.display='none';return}
 const{ax,ay}=atlasPoint(e);const w=workAt(ax,ay);
 if(w){hoverBox.style.display='block';hoverBox.style.left=w.x+'px';hoverBox.style.top=w.y+'px';
  hoverBox.style.width=w.width+'px';hoverBox.style.height=w.height+'px';stage.style.cursor='pointer'}
 else{hoverBox.style.display='none';stage.style.cursor=gesture?'grabbing':'grab'}}
stage.addEventListener('click',e=>{
 if(moved)return;
 const{ax,ay}=atlasPoint(e);const w=workAt(ax,ay);
 if(w)openModal(w);
});

/* ---------- modal ---------- */
let currentIndex=-1;
function applyDetail(){
 if(!detailView)return;
 artSurface.style.transform=`translate(${detailView.x}px,${detailView.y}px) scale(${detailView.scale})`;
 const rounded=Math.round(detailView.scale);
 artZoomOutput.value=`${Math.abs(detailView.scale-rounded)<.01?rounded:detailView.scale.toFixed(1)}×`;
}
function constrainDetail(){
 if(!detailView)return;
 const width=artPane.clientWidth,height=artPane.clientHeight;
 const scaledWidth=detailView.width*detailView.scale,scaledHeight=detailView.height*detailView.scale;
 detailView.x=scaledWidth<=width?(width-scaledWidth)/2:clamp(detailView.x,width-scaledWidth,0);
 detailView.y=scaledHeight<=height?(height-scaledHeight)/2:clamp(detailView.y,height-scaledHeight,0);
}
function fitDetail(w){
 const style=getComputedStyle(artPane);
 const horizontal=parseFloat(style.paddingLeft)+parseFloat(style.paddingRight);
 const vertical=parseFloat(style.paddingTop)+parseFloat(style.paddingBottom);
 const availableWidth=Math.max(1,artPane.clientWidth-horizontal);
 const availableHeight=Math.max(1,artPane.clientHeight-vertical);
 const baseScale=Math.min(availableWidth/w.width,availableHeight/w.height);
 const width=w.width*baseScale,height=w.height*baseScale;
 detailView={artwork:w,width,height,scale:1,x:(artPane.clientWidth-width)/2,
  y:(artPane.clientHeight-height)/2};
 detailGesture=null;detailPointers.clear();artPane.classList.remove('dragging');
 artSurface.style.width=`${width}px`;artSurface.style.height=`${height}px`;applyDetail();
}
function trackDetail(name,method){
 if(!detailView)return;
 const flag=name==='zoom_artwork'?'zoom':'pan';
 if(detailEngagement[flag])return;
 detailEngagement[flag]=true;
 const w=detailView.artwork;
 track(name,{artwork_id:w.id,book:w.book||0,method,zoom_level:+detailView.scale.toFixed(2)});
}
function setDetailZoom(next,px,py,method){
 if(!detailView)return;
 next=clamp(next,1,8);
 const ix=(px-detailView.x)/detailView.scale,iy=(py-detailView.y)/detailView.scale;
 detailView.x=px-ix*next;detailView.y=py-iy*next;detailView.scale=next;
 constrainDetail();applyDetail();
 if(next>1.01)trackDetail('zoom_artwork',method);
}
function zoomDetailAt(next,cx,cy,method){
 const bounds=artPane.getBoundingClientRect();
 setDetailZoom(next,cx-bounds.left,cy-bounds.top,method);
}
function detailPoint(event){
 const bounds=artPane.getBoundingClientRect();
 return{x:event.clientX-bounds.left,y:event.clientY-bounds.top};
}
function startDetailGesture(){
 if(!detailView)return;
 const pts=[...detailPointers.values()];
 if(pts.length===1){
  detailGesture={type:'pan',px:pts[0].x,py:pts[0].y,x:detailView.x,y:detailView.y};
 }else if(pts.length>=2){
  const[a,b]=pts;
  detailGesture={type:'pinch',distance:Math.max(1,Math.hypot(b.x-a.x,b.y-a.y)),
   cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,scale:detailView.scale,x:detailView.x,y:detailView.y};
 }
}
artPane.addEventListener('wheel',event=>{
 if(!detailView)return;
 event.preventDefault();
 const bounds=artPane.getBoundingClientRect();
 const unit=event.deltaMode===1?16:event.deltaMode===2?bounds.height:1;
 const delta=clamp(event.deltaY*unit,-240,240);
 zoomDetailAt(detailView.scale*Math.exp(-delta*.0015),event.clientX,event.clientY,'wheel');
},{passive:false});
artPane.addEventListener('pointerdown',event=>{
 if(!detailView||event.target.closest('button,a')||(event.pointerType==='mouse'&&event.button!==0))return;
 event.preventDefault();
 try{artPane.setPointerCapture(event.pointerId)}catch{}
 detailPointers.set(event.pointerId,detailPoint(event));startDetailGesture();
 artPane.classList.add('dragging');artPane.focus({preventScroll:true});
});
artPane.addEventListener('pointermove',event=>{
 if(!detailPointers.has(event.pointerId)||!detailGesture||!detailView)return;
 detailPointers.set(event.pointerId,detailPoint(event));
 const pts=[...detailPointers.values()];
 if(detailGesture.type==='pan'&&pts.length===1){
  const dx=pts[0].x-detailGesture.px,dy=pts[0].y-detailGesture.py;
  detailView.x=detailGesture.x+dx;detailView.y=detailGesture.y+dy;
  constrainDetail();applyDetail();
  if(detailView.scale>1.01&&Math.hypot(dx,dy)>5)trackDetail('pan_artwork','drag');
 }else if(detailGesture.type==='pinch'&&pts.length>=2){
  const[a,b]=pts,cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;
  const next=clamp(detailGesture.scale*Math.hypot(b.x-a.x,b.y-a.y)/detailGesture.distance,1,8);
  const ix=(detailGesture.cx-detailGesture.x)/detailGesture.scale;
  const iy=(detailGesture.cy-detailGesture.y)/detailGesture.scale;
  detailView.x=cx-ix*next;detailView.y=cy-iy*next;detailView.scale=next;
  constrainDetail();applyDetail();
  if(detailView.scale>1.01)trackDetail('zoom_artwork','pinch');
 }
});
function endDetailPointer(event){
 detailPointers.delete(event.pointerId);
 if(detailPointers.size)startDetailGesture();
 else{detailGesture=null;artPane.classList.remove('dragging')}
}
artPane.addEventListener('pointerup',endDetailPointer);
artPane.addEventListener('pointercancel',endDetailPointer);
artPane.addEventListener('dblclick',event=>{
 if(!detailView)return;
 const next=detailView.scale>1.01?1:2;
 zoomDetailAt(next,event.clientX,event.clientY,'double_click');
});
artPane.addEventListener('keydown',event=>{
 if(!detailView)return;
 const bounds=artPane.getBoundingClientRect(),centerX=bounds.left+bounds.width/2;
 const centerY=bounds.top+bounds.height/2,step=48;
 if(['+','=','-','_','0','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key)){
  event.preventDefault();event.stopPropagation();
 }
 if(event.key==='+'||event.key==='=')zoomDetailAt(detailView.scale*1.35,centerX,centerY,'keyboard');
 else if(event.key==='-'||event.key==='_')zoomDetailAt(detailView.scale/1.35,centerX,centerY,'keyboard');
 else if(event.key==='0')fitDetail(detailView.artwork);
 else if(event.key.startsWith('Arrow')&&detailView.scale>1.01){
  if(event.key==='ArrowLeft')detailView.x+=step;
  if(event.key==='ArrowRight')detailView.x-=step;
  if(event.key==='ArrowUp')detailView.y+=step;
  if(event.key==='ArrowDown')detailView.y-=step;
  constrainDetail();applyDetail();trackDetail('pan_artwork','keyboard');
 }
});
function drawArtToCanvas(w){
 const dpr=Math.min(devicePixelRatio||1,2);
 const cw=Math.round(w.width),ch=Math.round(w.height);
 artCanvas.width=cw*dpr/1.25;artCanvas.height=ch*dpr/1.25;
 const ctx=artCanvas.getContext('2d');
 ctx.imageSmoothingQuality='high';
 const sc=artCanvas.width/w.width;
 for(let i=0;i<data.tiles.length;i++){
  const t=data.tiles[i];
  if(t.x+t.width<=w.x||t.x>=w.x+w.width||t.y+t.height<=w.y||t.y>=w.y+w.height)continue;
  const img=tileImgs[i];
  const sx=Math.max(0,w.x-t.x),sy=Math.max(0,w.y-t.y);
  const ex=Math.min(t.width,w.x+w.width-t.x),ey=Math.min(t.height,w.y+w.height-t.y);
  const natScaleX=img.naturalWidth/t.width,natScaleY=img.naturalHeight/t.height;
  ctx.drawImage(img,sx*natScaleX,sy*natScaleY,(ex-sx)*natScaleX,(ey-sy)*natScaleY,
   (t.x+sx-w.x)*sc,(t.y+sy-w.y)*sc,(ex-sx)*sc,(ey-sy)*sc);
 }
}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function openModal(w){
 currentIndex=data.artworks.indexOf(w);
 detailEngagement={zoom:false,pan:false};
 const links=storeLinks(w);
 trackArtworkView(w);
 artCanvas.getContext('2d').clearRect(0,0,artCanvas.width,artCanvas.height);
 ensureTilesFor(w).then(()=>drawArtToCanvas(w));
 const group=data.groups.find(g=>g.book===w.book);
 const phase=group&&group.phase?({1:'The Telemachy',2:'The Wanderings',3:'The Homecoming'})[group.phase]:'';
 const anchor=passages.anchors&&passages.anchors[w.id];
 const bookInfo=w.book&&passages.books?passages.books[String(w.book)]:null;
 const passage=anchor&&anchor.text?anchor:(bookInfo&&bookInfo.excerpt?{text:bookInfo.excerpt.text,source:bookInfo.excerpt.source,ref:bookInfo.excerpt.lines}:null);
 let shot=null,shotShowsThisArt=false;
 if(ART_SCREENS.has(w.id)){shot=`screens/art/${w.id}.webp`;shotShowsThisArt=true}
 else if(w.book&&SCREENS.includes(w.book)){
  shot=`screens/book${String(w.book).padStart(2,'0')}.webp`;
  shotShowsThisArt=BOOK_SHOT_ART[w.book]===w.id;
 }
 const status=w.on_view?`<span class="onview">ON VIEW · ${esc(w.gallery||'')} · as of ${esc(w.as_of)}</span>`:'';
 const story=w.caption||w.blurb||'';
 const bookLabel=w.book?`Book ${ROMAN[w.book]}${group?' · '+esc(group.title):''}`:'From the museum catalog';
 const readLine=anchor&&anchor.ref?esc(anchor.ref):(w.book?`Book ${ROMAN[w.book]}`:'');
 infoPane.innerHTML=`
  <p class="overline">${esc(phase?phase+' · ':'')}${bookLabel}</p>
  <h2>${esc(w.title)}</h2>
  <p class="maker">${esc(w.creator)}${w.date?' · '+esc(w.date):''}${w.medium?' · '+esc(w.medium):''}</p>
  <p class="museum">${esc(w.museum||w.source_provider)}${w.city?' · '+esc(w.city):''}</p>
  <div class="skald-cta ${shot?'':'no-shot'}">
   <div class="cta-top">
    <p class="in-app">In the app</p>
    <div class="badges">
     <a class="badge" data-store="app_store" href="${esc(links.apple)}" target="_blank" rel="noreferrer"><svg viewBox="0 0 384 512" aria-hidden="true"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.7-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg><b>Skald: Odyssey</b> · App Store</a>
     <a class="badge" data-store="google_play" href="${esc(links.play)}" target="_blank" rel="noreferrer"><svg viewBox="0 0 512 512" aria-hidden="true"><path d="M325.3 234.3L104.6 13l280.8 161.2-60.1 60.1zM47 0C34 6.8 25.3 19.2 25.3 35.3v441.3c0 16.1 8.7 28.5 21.7 35.3l256.6-256L47 0zm425.2 225.6l-58.9-34.1-65.7 64.5 65.7 64.5 60.1-34.1c18-14.3 18-46.5-1.2-60.8zM104.6 499l280.8-161.2-60.1-60.1L104.6 499z"/></svg><b>Skald: Odyssey</b> · Google Play</a>
    </div>
   </div>
   <div class="cta-body">
    ${shot?`<div class="phone"><img src="${shot}" alt="Skald reader at ${bookLabel}"
      onerror="this.closest('.skald-cta').classList.add('no-shot')"></div>`:''}
    <div class="cta-copy">
     <h3>${shotShowsThisArt
       ?(MUSEUM_SHOTS.has(w.id)
         ?'This artwork lives in Skald’s museum gallery — shown here in the app'
         :`This artwork sits at ${readLine||'its line'} in Skald — shown here in the reader`)
       :(w.book?`Read Book ${ROMAN[w.book]} in Skald`:'Explore the Odyssey in Skald')}</h3>
    </div>
   </div>
   <p class="cta-footnote">${MUSEUM_SHOTS.has(w.id)
     ?'Skald’s museum gallery tracks where each artifact hangs today — and the reader anchors every placed artwork to its exact lines of the poem.'
     :'Skald anchors every artwork to its exact lines of the poem — read the Greek, a classic translation, and the story retold, with the art appearing right where it happens.'}</p>
  </div>
  ${status}
  ${story?`<p class="blurb">${esc(story)}</p>`:''}
  ${passage?`<div class="passage"><div class="lines">${esc(passage.text)}</div><div class="ref">${esc(passage.ref||'')}${passage.source?' · '+esc(passage.source):''}</div></div>`:''}
  <p class="links">
   ${w.museum_url?`<a href="${esc(w.museum_url)}" target="_blank" rel="noreferrer">Museum record ↗</a>&nbsp;&nbsp;`:''}
   ${w.file_page_url&&w.file_page_url!==w.museum_url?`<a href="${esc(w.file_page_url)}" target="_blank" rel="noreferrer">Image source ↗</a>&nbsp;&nbsp;`:''}
   <span style="color:var(--muted)">${esc(w.license_short||w.license)}</span>
  </p>`;
 veil.classList.add('open');modal.classList.add('open');hoverBox.style.display='none';fitDetail(w);
 infoPane.scrollTop=0;
 infoPane.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{
  const store=a.dataset.store;
  if(store)trackStoreClick(store,w);
  else track('click_source_record',{artwork_id:w.id,museum:w.museum||w.source_provider,url:a.href});
 }));
 if(w.book)setActiveBook(w.book);
}
function closeModal(){
 veil.classList.remove('open');modal.classList.remove('open');currentIndex=-1;
 detailPointers.clear();detailGesture=null;detailView=null;artPane.classList.remove('dragging');
 artSurface.style.transform='';artZoomOutput.value='1×';
}
document.getElementById('close').onclick=closeModal;
veil.onclick=closeModal;
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
addEventListener('keydown',e=>{
 if(e.key==='Escape')closeModal();
 if(currentIndex>=0&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){
  const next=currentIndex+(e.key==='ArrowRight'?1:-1);
  if(next>=0&&next<data.artworks.length)openModal(data.artworks[next]);
  e.preventDefault();
 }
});

const fsButton=document.getElementById('fullscreen');
const fsElement=()=>document.fullscreenElement??document.webkitFullscreenElement??null;
const fsSupported=document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen;
if(!fsSupported)fsButton.style.display='none';
fsButton.onclick=()=>{
 const root=document.documentElement;
 if(fsElement())(document.exitFullscreen||document.webkitExitFullscreen).call(document);
 else (root.requestFullscreen||root.webkitRequestFullscreen).call(root);
};
const fsLabel=fsButton.querySelector('.fs-label');
for(const ev of['fullscreenchange','webkitfullscreenchange'])
 document.addEventListener(ev,()=>{
  fsLabel.textContent=fsElement()?' Exit full screen':' Full screen';
  fsButton.setAttribute('aria-pressed',fsElement()?'true':'false');
  setTimeout(fit,60);
 });
document.getElementById('plus').onclick=()=>zoomAt(scale*1.4,VW()/2,VH()/2);
document.getElementById('minus').onclick=()=>zoomAt(scale/1.4,VW()/2,VH()/2);
document.getElementById('fit').onclick=fit;
/* Re-fit only on a real viewport change: mobile browser chrome and the
   soft keyboard fire resize constantly and must not reset the user's view. */
let lastVW=0,lastVH=0,refitTimer=null;
function onViewportChange(){
 syncViewportVar();
 const w=Math.round(VW()),h=Math.round(VH());
 if(Math.abs(w-lastVW)<2&&Math.abs(h-lastVH)<2)return;
 lastVW=w;lastVH=h;
 clearTimeout(refitTimer);refitTimer=setTimeout(()=>{
  lastVW=Math.round(VW());lastVH=Math.round(VH());
  if(currentIndex>=0&&detailView)fitDetail(detailView.artwork);else fit();
 },120);
}
addEventListener('resize',onViewportChange);
addEventListener('orientationchange',()=>setTimeout(onViewportChange,250));
if(vv){vv.addEventListener('resize',onViewportChange);vv.addEventListener('scroll',syncViewportVar)}
syncViewportVar();
fit();
lastVW=Math.round(VW());lastVH=Math.round(VH());
const params=new URLSearchParams(location.search);
if(params.get('book')){const g=data.groups.find(g=>g.book===+params.get('book'));if(g)setTimeout(()=>{setActiveBook(g.book);flyToGroup(g)},400)}
if(params.get('work')){const w=data.artworks.find(a=>a.id===params.get('work'));if(w)setTimeout(()=>openModal(w),500)}
</script>
