<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Skald · The Odyssey in Art — Book Atlas</title>

<style>
@font-face{font-family:'Cormorant';src:url('fonts/cormorant_garamond_semibold.ttf');font-weight:600}
@font-face{font-family:'Cormorant';src:url('fonts/cormorant_garamond_medium.ttf');font-weight:500}
@font-face{font-family:'CormorantItal';src:url('fonts/cormorant_garamond_medium_italic.ttf');font-style:italic}
@font-face{font-family:'NotoSerif';src:url('fonts/noto_serif_regular.ttf')}
:root{
 --canvas:#14100C;--panel:#1E1813;--panel-edge:#3A2E22;--paper:#F1E5CD;--paper-deep:#E3D0AD;
 --ink:#211B16;--muted:#8C7B64;--accent:#A4482E;--gold:#C59A4A;--gold-dim:#8A6B33;--frame:#5B4939;
 --vh:100%;
 --safe-b:env(safe-area-inset-bottom,0px);--safe-l:env(safe-area-inset-left,0px);
 --safe-r:env(safe-area-inset-right,0px);--safe-t:env(safe-area-inset-top,0px);
 color-scheme:dark;
}
@supports (height:100dvh){:root{--vh:100dvh}}
*{box-sizing:border-box}
/* --vh is refreshed from visualViewport so mobile browser chrome (address bar,
   gesture bar) can never push the fixed topbar or rail outside the visible area. */
html,body{width:100%;height:100%;height:var(--vh);margin:0;overflow:hidden;background:var(--canvas);
 font-family:'NotoSerif',Georgia,serif;color:var(--paper)}
#stage{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab}
#stage.dragging{cursor:grabbing}
#atlas{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none}
#atlas img{position:absolute;display:block;max-width:none;-webkit-user-drag:none}
#hover{position:absolute;border:3px solid var(--gold);box-shadow:0 0 0 3px #0008,0 0 34px #C59A4A55;
 pointer-events:none;display:none;border-radius:2px}
#grouphover{position:absolute;border:2px solid var(--gold-dim);pointer-events:none;display:none;border-radius:4px}

#topbar{position:fixed;left:0;right:0;top:0;height:58px;display:flex;align-items:center;gap:18px;
 flex-wrap:nowrap;padding:0 calc(22px + var(--safe-r)) 0 calc(22px + var(--safe-l));
 background:linear-gradient(#14100Cf2,#14100Cd8 78%,transparent);z-index:5;pointer-events:none}
#topbar .brand{font-family:'Cormorant';font-weight:600;font-size:21px;letter-spacing:.24em;color:var(--gold);
 flex:none;white-space:nowrap}
#topbar .tag{font-size:12.5px;color:var(--muted);font-style:italic;font-family:'CormorantItal';font-size:16px;
 flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .spacer{flex:1 1 0;min-width:0}
#topbar #zoomers{display:contents}
#topbar button,#topbar a{pointer-events:auto;flex:none;white-space:nowrap}
#topbar #credits,#topbar #privacy{border:1px solid var(--frame);background:#211a15;
 color:var(--paper);border-radius:999px;padding:8px 15px;
 font:600 13px 'NotoSerif',Georgia,serif;text-decoration:none}
#topbar #credits:hover,#topbar #privacy:hover{border-color:var(--gold-dim);color:var(--gold)}
button{border:1px solid var(--frame);background:#211a15;color:var(--paper);border-radius:999px;
 padding:8px 15px;font:600 13px 'NotoSerif',Georgia,serif;cursor:pointer}
button:hover{border-color:var(--gold-dim);color:var(--gold)}

#rail{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--safe-b));z-index:5;
 display:flex;align-items:center;
 gap:3px;padding:9px 14px;background:#171310ee;border:1px solid var(--frame);border-radius:999px;
 box-shadow:0 12px 40px #000a;max-width:calc(100vw - 24px);overflow-x:auto;overscroll-behavior-x:contain;
 -webkit-overflow-scrolling:touch;scrollbar-width:none}
#rail::-webkit-scrollbar{display:none}
#rail .phase-sep{width:1px;height:22px;background:var(--frame);margin:0 7px;flex:none}
#rail .bk{flex:none;min-width:34px;padding:5px 7px;border:none;background:none;border-radius:8px;
 font-family:'Cormorant';font-weight:600;font-size:16px;color:var(--muted);text-align:center}
#rail .bk:hover{color:var(--gold);background:#26201a}
#rail .bk.active{color:var(--ink);background:var(--gold)}
#rail .phase-label{flex:none;font-size:9px;letter-spacing:.16em;color:var(--gold-dim);
 text-transform:uppercase;margin:0 5px 0 9px;line-height:1;align-self:center}

#veil{position:fixed;inset:0;background:#0b0805cc;backdrop-filter:blur(6px);z-index:8;display:none}
#modal{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;padding:26px}
#modal.open,#veil.open{display:flex}
#sheet{display:flex;gap:0;max-width:min(1240px,96vw);max-height:92vh;width:100%;
 background:var(--panel);border:1px solid var(--panel-edge);border-radius:18px;overflow:hidden;
 box-shadow:0 40px 120px #000d,0 0 0 1px #00000088}
#art-pane{flex:1.15;min-width:0;background:#0e0b08;position:relative;padding:34px;overflow:hidden;
 touch-action:none;cursor:grab;outline:none}
#art-pane.dragging{cursor:grabbing}
#art-pane:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
#art-surface{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;user-select:none}
#art-surface canvas{display:block;width:100%;height:100%;box-shadow:0 18px 60px #000c;
 border:1px solid #00000066;pointer-events:none}
#art-help,#art-zoom{position:absolute;bottom:14px;z-index:1;margin:0;padding:5px 9px;border-radius:999px;
 color:var(--paper);background:#14100Ccc;font:500 11px 'NotoSerif',Georgia,serif;pointer-events:none}
#art-help{left:16px}#art-zoom{right:16px;font-variant-numeric:tabular-nums}
#info-pane{flex:1;min-width:340px;max-width:520px;overflow-y:auto;padding:34px 36px 30px;scrollbar-width:thin}
#info-pane .overline{font-size:11.5px;letter-spacing:.22em;color:var(--gold-dim);text-transform:uppercase;margin:0 0 10px}
#info-pane h2{font-family:'Cormorant';font-weight:600;font-size:31px;line-height:1.12;margin:0 0 8px;color:var(--paper)}
#info-pane .maker{font-size:14.5px;color:var(--paper-deep);margin:0 0 4px}
#info-pane .museum{font-size:13px;color:var(--muted);margin:0 0 14px}
#info-pane .onview{display:inline-block;font-size:10.5px;letter-spacing:.14em;color:var(--gold);
 border:1px solid var(--gold-dim);border-radius:999px;padding:3px 10px;margin:0 0 14px}
#info-pane .blurb{font-size:14px;line-height:1.62;color:var(--paper-deep);margin:0 0 18px}
.passage{border-left:2px solid var(--gold-dim);padding:4px 0 4px 18px;margin:0 0 18px}
.passage .lines{font-family:'CormorantItal';font-style:italic;font-size:19px;line-height:1.5;color:var(--paper);white-space:pre-line}
.passage .ref{font-size:12px;color:var(--gold-dim);margin-top:8px}
.links{font-size:12.5px;margin:0 0 22px}
.links a{color:var(--gold);text-decoration:none;border-bottom:1px solid #C59A4A44}
.links a:hover{border-bottom-color:var(--gold)}
#close{position:absolute;top:16px;right:16px;z-index:2;width:38px;height:38px;border-radius:50%;
 font-size:17px;line-height:1;padding:0}

.skald-cta{display:flex;flex-direction:column;gap:14px;background:#171310;border:1px solid var(--panel-edge);
 border-radius:14px;padding:18px;margin:0 0 18px}
.cta-top{display:flex;flex-direction:column;gap:8px}
.in-app{font-size:11px;letter-spacing:.2em;color:var(--gold-dim);text-transform:uppercase;margin:0}
.badges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.badge{font-family:'NotoSerif',Georgia,serif;font-size:11px;line-height:1.25;padding:7px 9px;min-height:40px;
 border:1px solid var(--gold-dim);border-radius:8px;color:var(--paper);text-decoration:none;text-align:center;
 display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.badge:hover{border-color:var(--gold);background:#211a12;color:var(--paper)}
.badge b{color:inherit;font-weight:600}
.badge svg{width:13px;height:13px;fill:currentColor;flex:none}
.cta-body{display:grid;grid-template-columns:minmax(88px,118px) minmax(0,1fr);gap:18px;align-items:center}
.phone{width:100%;border-radius:16px;border:2px solid var(--frame);background:#000;
 padding:5px;box-shadow:0 10px 34px #000b;align-self:flex-start}
.phone img{width:100%;display:block;border-radius:11px}
.cta-copy{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.cta-copy h3{font-family:'Cormorant';font-weight:600;font-size:22px;line-height:1.15;margin:0;color:var(--paper)}
.cta-footnote{font-size:12.5px;line-height:1.55;color:var(--muted);margin:0}
.no-shot .phone{display:none}
.no-shot .cta-body{grid-template-columns:minmax(0,1fr)}

/* ---- tablet / narrow desktop: one tidy topbar row, no phone collapse ---- */
@media (max-width:1000px){
 #topbar{gap:12px;padding:0 calc(16px + var(--safe-r)) 0 calc(16px + var(--safe-l))}
 #topbar .brand{font-size:19px;letter-spacing:.18em}
 #topbar .tag{font-size:15px}
 #topbar .tag .tag-more{display:none}
 #topbar #credits,#topbar #privacy,#topbar button{padding:8px 12px;font-size:12.5px}
}

@media (max-width:860px){
 #sheet{flex-direction:column;overflow-y:auto}
 #art-pane{flex:none;height:44vh;min-height:260px;max-height:44vh;padding:20px}
 #info-pane{max-width:none;min-width:0}
}

/* ---- phones ---- */
@media (max-width:600px){
 #topbar{height:calc(52px + var(--safe-t));padding-top:var(--safe-t);gap:7px;
  padding-right:calc(10px + var(--safe-r));padding-left:calc(10px + var(--safe-l))}
 #topbar .brand{font-size:16px;letter-spacing:.1em;word-spacing:-.14em}
 #topbar .tag{display:none}
 #topbar #credits,#topbar #privacy,#topbar button{padding:0 12px;height:38px;font-size:12.5px;
  display:inline-flex;align-items:center;justify-content:center}
 #topbar #fullscreen{padding:0 11px;font-size:15px}
 #topbar #fullscreen .fs-label{display:none}
 /* zoom cluster leaves the crowded topbar and sits above the book rail */
 #topbar #zoomers{display:flex;gap:7px;position:fixed;z-index:5;
  right:calc(10px + var(--safe-r));bottom:calc(76px + var(--safe-b))}
 #topbar #zoomers button{min-width:38px;background:#211a15e8;
  box-shadow:0 6px 20px #000a}

 #rail{left:calc(8px + var(--safe-l));right:calc(8px + var(--safe-r));transform:none;
  max-width:none;bottom:calc(10px + var(--safe-b));gap:2px;padding:6px 8px;border-radius:22px}
 #rail .phase-label{display:none}
 #rail .phase-sep{margin:0 5px;height:18px}
 #rail .bk{min-width:32px;padding:7px 5px;font-size:15px}

 #modal{padding:0}
 #sheet{width:100%;height:100%;max-width:none;max-height:none;border-radius:0;border:none;
  overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
 #art-pane{flex:none;height:40%;min-height:180px;max-height:none;padding:14px}
 #art-help{left:10px;bottom:10px;max-width:calc(100% - 78px);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
 #art-zoom{right:10px;bottom:10px}
 #close{top:10px;right:10px;width:44px;height:44px;background:#211a15e8}
 #info-pane{flex:1 0 auto;overflow:visible;padding:20px 18px calc(30px + var(--safe-b));max-width:none;min-width:0}
 #info-pane h2{font-size:26px}
 .passage .lines{font-size:17px}
 .skald-cta{gap:11px;padding:14px}
 .badges{grid-template-columns:minmax(0,1fr);gap:6px}
 .badge{min-height:40px;font-size:11.5px;padding:6px 8px;gap:6px}
 .badge svg{width:12px;height:12px}
 .cta-body{grid-template-columns:minmax(82px,32vw) minmax(0,1fr);gap:12px;align-items:start}
 .cta-copy h3{font-size:19px;line-height:1.12}
 .cta-footnote{font-size:11.5px;line-height:1.45}
 .no-shot .cta-body{grid-template-columns:minmax(0,1fr)}
}

@media (max-width:860px) and (orientation:landscape) and (max-height:600px){
 #modal{padding:0}
 #sheet{width:100%;height:100%;max-width:none;max-height:none;border-radius:0;border:none;
  flex-direction:row;overflow:hidden}
 #art-pane{flex:.9;min-width:0;height:auto;min-height:0;max-height:none;padding:14px}
 #info-pane{flex:1.1;min-width:0;max-width:none;overflow-y:auto;padding:16px 18px}
 #info-pane h2{font-size:24px}
 .skald-cta{gap:10px;padding:12px}
 .in-app{font-size:9.5px}
 .badge{min-height:36px;font-size:9.5px;padding:5px 6px;gap:5px}
 .badge svg{width:11px;height:11px}
 .cta-body{grid-template-columns:minmax(72px,90px) minmax(0,1fr);gap:10px;align-items:start}
 .cta-copy h3{font-size:18px;line-height:1.1}
 .cta-footnote{font-size:10.5px;line-height:1.35}
 .no-shot .cta-body{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>

Wikimedia Commons (PD-Art)", "on_view": false, "gallery": "", "as_of": "2026-07", "license": "Public Domain (PD-Art / CC Public Domain Mark 1.0)", "license_short": "PD", "credit": "Cultural Heritage Agency of the Netherlands, NK collection (NK 1830), on long-term loan to Museum Het Rembrandthuis", "blurb": "Pieter Lastman — Rembrandt’s own teacher — paints the goddess Minerva meeting Odysseus, the wise protector who never abandons her favorite hero.", "caption": "Look for the owl at the seated goddess's feet - Athena's own bird - as a leopard-skinned Odysseus hefts a great embossed shield beside her. Lastman paints their face-to-face meeting, which in Homer comes only on Odysseus's return in Book 13; here it stands in for the bond Book I sets working from afar. (Od. 13.221-235)", "line": 3, "museum_url": "https://wo2.collectienederland.nl/doc/nk/NK1830", "file_page_url": "https://commons.wikimedia.org/wiki/File:P.P._Lastman_-_Odysseus_en_Minerva_-_NK1830_-_Cultural_Heritage_Agency_of_the_Netherlands_Art_Collection.jpg"}, {"index": 2, "id": "brighton-kauffmann-penelope-loom", "book": 1, "x": 4170, "y": 806, "width": 800, "height": 800, "title": "Penelope at Her Loom", "creator": "Angelica Kauffmann", "date": "1764", "medium": "Oil on canvas", "museum": "Brighton & Hove Museums (Brighton Museum & Art Gallery)", "city": "Brighton, England", "source_provider": "Wikimedia Commons (PD-Art)", "on_view": false, "gallery": "", "as_of": "2026-07", "license": "Public Domain (PD-Art / CC Public Domain Mark 1.0)", "license_short": "PD", "credit": "Brighton & Hove Museums (FAH1975.33)", "blurb": "Angelica Kauffmann paints patient Penelope pausing at her loom, dreaming of Odysseus while the weaving waits to be secretly undone.", "caption": "Kauffmann gives Penelope the classic mourner's pose - cheek propped on one hand - a faithful hound at her feet and a great bow lying on the floor. She gathers symbols from across the whole poem (the bow's contest waits until Book XXI) into one ea.", "caption": "One of Theodoor van Thulden's 1633 etchings recording the lost Ulysses Gallery at Fontainebleau (frescoes by Primaticcio and Niccolo dell'Abate). At the water's edge a victim is brought for sacrifice while the hero steps into a galley whose prow curls into a sea-beast - grander and more Italian than Butler's plain telling. In Book VIII the feasting begins only after Alcinous makes such an offering (Od. 8.59-61).", "line": 59, "museum_url": "https://www.rijksmuseum.nl/en/collection/RP-P-OB-66.733", "file_page_url": "https://www.rijksmuseum.nl/nl/collectie/RP-P-OB-66.733"}, {"index": 58, "id": "flaxman-demodocus-sings", "book": 8, "x": 15174, "y": 2900, "width": 800, "height": 800, "title": "Demodocus Sings the Song of Troy (from The Odyssey of Homer)", "creator": "John Flaxman, engr. Tommaso Piroli", "date": "1793/1805", "medium": "Line engraving", "museum": "The Metropolitan Museum of Art", "city": "New York, USA", "source_provider": "Wikimedia Commons (PD-Art)", "on_view": false, "gallery": "", "as_of": "2026-07", "license": "Public Domain (PD-Art / CC Public Domain Mark 1.0)", "license_short": "PD", "credit": "The Metropolitan Museum of Art (1977.595.50)", "blurb": "The blind bard Demodocus plays his lyre and sings of the great war at Troy — and hidden Odysseus quietly covers his face and cries.", "caption": "The blind bard Demodocus plays his lyre and sings of the great war at Troy — and hidden Odysseus quietly covers his face and cries.", "line": 83, "museum_url": "https://www.metmuseum.org/art/collection/search/337338", "file_page_url": "https://commons.wikimedia.org/wiki/File:OdysseyDemodokos.png"}, {"index": 60, "id": "met-248902", "book": 8, "x": 15974, "y": 2900, "width": 800, "height": 800, "title": "Terracotta Panathenaic prize amphora", "creator": "Attributed to the Euphiletos Painter", "date": "ca. 530 BCE", "medium": "Terracotta", "museum": "The Metropolitan Museum of Art", "city": "New York, USA", "source_provider": "The Metropolitan s-penelope-and-suitors", "book": 18, "x": 16042, "y": 7738, "width": 800, "height": 800, "title": "Penelope and Her Suitors", "creator": "Johann Rudolf Byss", "date": "1692", "medium": "Oil on canvas", "museum": "National Gallery Prague", "city": "Prague, Czech Republic", "source_provider": "Wikimedia Commons (PD-Art)", "on_view": false, "gallery": "", "as_of": "2026-07", "license": "Public Domain (PD-Art / CC Public Domain Mark 1.0)", "license_short": "PD", "credit": "National Gallery Prague (NG.O 11978)", "blurb": "For years a crowd of pushy suitors has filled Penelope’s home, eating her food and demanding she choose a new husband. Johann Rudolf Byss shows her among them, still holding them off with her cleverness while she waits and hopes for Odysseus.", "caption": "For years a crowd of pushy suitors has filled Penelope’s home, eating her food and demanding she choose a new husband. Johann Rudolf Byss shows her among them, still holding them off with her cleverness while she waits and hopes for Odysseus.", "line": 275, "museum_url": "https://sbirky.ngprague.cz/en/dielo/CZE:NG.O_11978", "file_page_url": "https://commons.wikimedia.org/wiki/File:Jan_Rudolf_Bys_-_Penelope_and_Her_Suitors_-_O_11978_-_National_Gallery_Prague.jpg"}, {"index": 161, "id": "aic-268597", "book": 18, "x": 15242, "y": 8538, "width": 800, "height": 800, "title": "Fight between Ulysses and Irus", "creator": "Jan Harmensz Muller (Dutch, 1571–1628), after Cornelis van Haarlem (Dutch, 1562–1638)", "date": "1589", "medium": "Engraving on ivory laid paper", "museum": "The Art Institute of Chicago", "city": "Chicago, USA", "source_provider": "The Art Institute of Chicago", "on_view": false, "gallery": "", "as_of": "2026-07", "license": "CC0 1.0 Universal Public Domain Dedication", "license_short": "CC0", "credit": "Charles Hack and the Hearn Family Trust Collection, purchased with funds provided by the Harry B. and Bessie K. Braude Memorial, Amanda S. Johnson and Marion J. Livingston, anonymous, and m (RP-P-OB-66.769)", "blurb": "Goddess Athena whispers courage to Odysseus: step up, take the great bow no suitor could bend, and show them who the real king is.", "caption": "This 1633 etching preserves a lost masterpiece: van Thulden copied it from Primaticcio's frescoes in the Gallery of Ulysses at Fontainebleau, destroyed a century later. A helmeted goddess dives from the clouds at upper left to set the contest of the bow in motion (Od. 19.571-587); notice the Mannerist sphinx tucked among the columns - pure Fontainebleau invention, nowhere in Homer.", "line": 556, "museum_url": "https://www.rijksmuseum.nl/en/collection/RP-P-OB-66.769", "file_page_url": "https://commons.wikimedia.org/wiki/File:Minerva_zet_Odysseus_aan_om_de_boog_te_vragen_De_werken_van_Odysseus_(serietitel),_RP-P-OB-66.769.jpg"}, {"index": 167, "id": "cleveland-lemonnier-penelope-1996-286", "book": 19, "x": 1268, "y": 10482, "width": 800, "height": 800, "title": "Study for Penelope", "creator": "Anicet Charles Gabriel Lemonnier", "date": "c. 1806", "medium": "Black and white chalk on paper", "museum": "Cleveland Museum of Art", "city": "Cleveland, USA", "source_provider": "Cleveland Museum of Art (CC0)", "on_view": false, "gallery": "", "as_of": "2026-07", "license": "CC0 1.0 Universal Public Domain Dedication", "license_short": "CC0", "credit": "Cleveland Museum of Art (1996.286)", "blurb": "A quiet chalk study of faithful Penelope, who waited twenty long years for Odysseus while cleverly outwitting the suitors at her palace.", "caption": "A quiet chalk study of faithful Penelope, who waited twenty long years for Odysseus while cleverly outwitting the suitors at her palace.", "line": 602, "museum_url": "https://www.clevelandart.org/art/1996.286", "file_page_url": "https://www.clevelandart.org/art/1996.286"}, {"index": 168, "id": "aic-9790", "book": 19, "x": 2068, "y": 10482, "width": 800, "height": 800, "title": "Coin Depicting the God Zeus", "creator": "Greek, Ptolemaic; minted in Egypt", "date": "117–111 BCE, issued by Ptolemy IX (Soter II)", "medium": "Copper", "museum": "The Art Institute of Chicago", "city": "Chicago, USA", "source_provider": "The Art Institute of Chicago", "on_view": false, "gallery": "", "as_of": "2026-07", "license": "CC0 1.0 Universal Public Domain Dedication", "license_short": "CC0", "credit": "Gift of Mrs. William Nelson Pelouze", "blurb": "The Greeks read eagles as messages straight from Zeus. In Penelope’s dream a great eagle swoops down and kills her flock of geese; soon after, an eagle clutching a dove startles the suitors at their feast. This little coin carries Zeus on one face and his eagles on the other, the very bird they watched the sky for.", "caption": "", "line": null, "museum_url": "https://www.artic.edu/artworks/9790", "file_page_url": "https://www.artic.edu/artworks/9790"}, {"index": 169, "id": "aic-54927", "book": 19, "x": 2868, "y": 10482, "width": 800, "height": 800, "title": "Odysseus and Eurycleia", "creator": "Possibly Andrea Appiani the elder (Italian, 1754-1817), or an unknown artist (French, 18th century), in the style of Anne-Louis Girodet de Roucy-Trioson (French, 1767-1824)", "date": "n.d.", "medium": "Black and white chalk with stumping on tan laid paper", "museum": "The Art Institute of Chicago", "city": "Chicago, USA", "source_provider": "The Art Institute of Chicago", "on_view": false, "gallery": "", "as_of": "2026-07", "license": "CC0 1.0 Universal Public Domain Dedication", "license_short": "CC0", "credit": "The Charles Deering Collection", "blurb": "The old nurse Eurycleia washes the stranger’s feet and feels the scar she knows — the quiet moment she recognizes Odysseus, home at last.", "caption": "", "line": null, "museum_url": "https://www.artic.edu/artworks/54927", "file_page_url": "https://www.artic.edu/artworks/54927"}, {"index": 170, "id": "aic-76096", "book": 19, "x": 3668, "y": 10482, "width": 800, "height": 800, "title": "The Calydonian Boar Hunt, from the Houghton Gallery", "creator": "Richard Earlom (British, 1743-1822), after Peter Paul Rubens (Flemish, 1577-1640)", "date": "1781", "medium": "Mezzotint in black on ivory wove paper", "museum": "The Art Institute of Chicago", "city": "Chicago, USA", "source_provider": "The Art Institute of Chicago", "on_view": false, "gallery": "", "as_of": "2026-07", "license": "CC0 1.0 Universal Public Domain Dedication", "license_short": "CC0", "credit": "Gift of Langdon Pearse", "blurb": "The old nurse knows Odysseus in an instant, by an old scar on his leg from a boar hunt when he was a boy. Rubens imagined heroes closing on a giant boar with spears and hounds, just like the hunt on Mount Parnassus that marked him for life.", "caption": "", "line": null, "museum_url": "https://www.artic.edu/artworks/76096", "file_page_url": "https://www.artic.edu/artworks/76096"}, {"index": 172, "id": "louvre-boeotian-bakers-ca804", "book": 20, "x": 5336, "y": 9682, "width": 800, "height": 800, "title": "Group of figurines: women kneading dough with a flute-player", "creator": "Boeotian Greek (unknown maker), from Thebes", "date": "c. 525–475 BCE", "medium": "Terracotta figurine group", "museum": "Musée du Louvre", "city": "Paris, France", "source_provider": "Wikimedia Commons (CC BY 2.5)", "on_view": false, "gallery": "", "as_of": "2026-07", "license": "CC BY 2.5", "license_short": "CC BY", "credit": "Musée du Louvre, Paris (CA 804)", "blurb": "Before dawn in Book 20, twelve serving-women grind grain in the palace, and the frailest, still bent over her millstone, prays for the suitors’ very last meal. This little clay group shows that exact world: women kneading dough while a flute-player keeps the rhythm of the work.", "caption": "", "line": null, "museum_url": "https://collections.louvre.fr/en/ark:/53355/cl010258992", "file_page_url": "https://commons.wikimedia.org/wiki/File:Bakers_kneading_Louvre_CA804.jpg"}, {"index": 173, "id": "bm-cromek-penelope-bow", "book": 21, "x": 6204, "y": 9682, "width": 800, "height": 800, "title": "Penelope Holding the Bow of Odysseus", "creator": "Robert Hartley Cromek, after Henry Fuseli", "date": "1806", "medium": "Engraving and etching", "museum": "British Museum", "city": "London, England", "source_provider": "Wikimedia Commons (PD-Art)", "on_view": false, "gallery": "", "as_of": "2026-07", "license": "Public Domain (PD-Art / CC Public Domain Mark 1.0)", "license_short": "PD", "credit": "British Museum, London (1853,1210.552)", "blurb": "Penelope lifts her husband’s great bow and announces the contest: whoever can string it and shoot through twelve axes may win her hand.", "caption": "Fuseli, engraved here by Cromek, gives the whole grief to one gesture: Penelope bows her head over the great bow laid across her lap, the quiver standing at her chair, before she can carry it down to the hall (Od. 21.55-57). She weeps over the weapon that is her husband's memory and, though she cannot know it, the instrument of his return.", "line": 3, "museum_url": "https://www.britishmuseum.org/collection/object/P_1853-1210-552", "file_page_url": "https://commons.wikimedia.org/wiki/File:Robert_Hartley_Cromek_-_Penelope_Holding_the_Bow_of_Odysseus,_1806.jpg"}, {"index": 174, "id": "met-252388", "book": 21, "x": 7004, "y": 9682, "width": 800, "height": 800, "title": "Bronze double-ax head", "creator": "Unknown", "date": "ca. 1700–1450 BCE", "medium": "Bronze", "museum": "The Metropolitan Museum of Art", "city": "New York, USA", "source_provider": "The Metropolitan Museum of Art", "on_view": true, "gallery": "Gallery 151", "as_of": "2026-07", "license": "CC0 1.0 Universal Public Domain Dedication", "license_short": "CC0", "credit": "Bequest of Richard B. Seager, 1926", "blurb": "Odysseus’s contest is to send a single arrow flying through a row of twelve axe-heads set up down the hall. This Minoan double-axe, older than the story itself and probably a votive offering, is evocative of the very blades whose line made that impossible-looking target.", "caption": "Odysseus’s contest is to send a single arrow flying through a row of twelve axe-heads set up down the hall. This Minoan double-axe, older than the story itself and probably a votive offering, is evocative of the very blades whose line made that impossible-looking target.", "line": 120, "museum_url": "https://www.metmuseum.org/art/collection/search/252388", "file_page_url": "https://www.metmuseum.org/art/collection/search/252388"}, {"index": 175, "id": "rijks-thulden-weapons-to-eumaeus", "book": 21, "x": 7804, "y": 9682, "width": 800, "height": 800, "title": "Odysseus Gives His Weapons to Eumaeus", "creator": "Theodoor van Thulden, after Francesco Primaticcio", "date": "1632–1633", "medium": "Etching and engraving", "museum": "Rijksmuseum", "city": "Amsterdam, Netherlands", "source_provider": "Wikimedia Commons (CC0)", "on_view": false, "gallery": "", "as_of": "2026-07", "license": "CC0 1.0 Universal Public Domain Dedication", "license_short": "CC0", "credit": "Rijksmuseum, Amsterdam (RP-P-OB-66.783)", "blurb": "Odysseus hands his weapons to loyal Eumaeus to hide away, so the greedy suitors will have nothing to grab when the great test begins.", "caption": "Odysseus hands his weapons to loyal Eumaeus to hide away, so the greedy suitors will have nothing to grab when the great test begins.", "line": 190, "museum_url": "https://www.rijksmuseum.nl/en/collection/RP-P-OB-66.783", "file_page_url": "https://commons.wikimedia.org/wiki/File:Odysseus_geeft_zijn_wapens_aan_Eumaeus_De_werken_van_Odysseus_(serietitel),_RP-P-OB-66.783.jpg"}, {"index": 176, "id": "vanthulden-arrow-twelve-axes", "book": 21, "x": 6204, "y": 10482, "width": 800, "height": 800, "title": "Odysseus shoots the arrow through the twelve axes", "creator": "Theodoor van Thulden, after Francesco Primaticcio", "date": "1632–1633", "medium": "Etching and engraving", "museum": "Rijksmuseum", "city": "Amsterdam, Netherlands", "source_provider": "Wikimedia Commons (CC0)", "on_view": false, "gallery": "", "as_of": "2026-07", "license": "CC0 1.0 Universal Public Domain Dedication", "license_short": "CC0", "credit": "Rijksmuseum, Amsterdam (RP-P-OB-66.770)", "blurb": "With one perfect shot, Odysseus sends his arrow flying straight through all twelve axe-rings — proof that the beggar is truly the lost king.", "caption": "With one perfect shot, Odysseus sends his arrow flying straight through all twelve axe-rings — proof that the beggar is truly the lost king.", "line": 420, "museum_url": "https://www.rijksmuseum.nl/en/collection/RP-P-OB-66.770", "file_page_url": "https://commons.wikimedia.org/wiki/File:Odysseus_schiet_de_pijl_door_de_twaalf_ringen_De_werken_van_Odysseus_(serietitel),_RP-P-OB-66.770.jpg"}, {"index": 177, "id": "met-255955", "book": 21, "x": 7004, "y": 10482, "width": 800, "height": 800, "title": "Bronze statuette of a Scythian mounted archer", "creator": "Unknown", "date": "early 5th century BCE", "medium": "Bronze", "museum": "The Metropolitan Museum of Art", "city": "New York, USA", "source_provider": "The Metropolitan Museum of Art", "on_view": true, "gallery": "Gallery 170", "as_of": "2026-07", "license": "CC0 1.0 Universal Public Domain Dedication", "license_short": "CC0", "credit": "Gift of Norbert Schimmel Trust, 1989", "blurb": "None of the suitors can bend the great bow, and young Telemachus nearly strings it himself before Odysseus signals him to stop. When Odysseus takes it up at last, the whole hall falls silent — this little bronze archer, bow in hand, shows the deadly skill the Greeks pictured in their lost king.", "caption": "", "line": null, "museum_url": "https://www.metmuseum.org/art/collection/search/255955", "file_page_url": "https://www.metmuseum.org/art/collection/search/255955"}, {"index": 178, "id": "berlin-suitors-skyphos-f2588", "book": 22, "x": 8672, "y": 9682, "width": 800, "height": 800, "title": "Skyphos: Odysseus slaying the suitors", "creator": "Penelope Painter, Attic Greek", "date": "c. 440 BC", "medium": "Attic red-figure skyphos (terracotta)", "museum": "Antikensammlung, Berlin", "city": "Berlin, Germany", "source_provider": "Wikimedia Commons (CC0)", "on_view": true, "gallery": "Altes Museum", "as_of": "2026-07", "license": "CC0 1.0 Universal Public Domain Dedication", "license_short": "CC0", "credit": "Antikensammlung, Staatliche Museen zu Berlin (F 2588)", "blurb": "Back home at last, Odysseus draws his great bow and fights off the greedy suitors who tried to take his palace and his wife.", "caption": "The killing of the suitors is rare in Greek vase-painting, which makes this red-figure skyphos precious: the figures glow orange where the potter left the clay bare and painted the ground black. Two long-robed suitors shrink back along the Greek-key border as the bowman's vengeance begins (Od. 22.1-41).", "line": 3, "museum_url": "https://smb.museum-digital.de/object/9275", "file_page_url": "https://commons.wikimedia.org/wiki/File:Attic_Red-figure_Skyphos_depicting_the_slaughter_of_the_suitors_of_Penelope_by_Odysseus,_by_the_Penelope_Painter,_c._440_BC_(28123411913).jpg"}, {"index": 179, "id": "berlinische-corinth-suitors-fight", "book": 22, "x": 9472, "y": 9682, "width": 800, "height": 800, "title": "The Suitors Fighting Odysseus", "creator": "Lovis Corinth", "date": "1913", "medium": "Tempera on canvas", "museum": "Berlinische Galerie", "city": "Berlin, Germany", "source_provider": "Wikimedia Commons (PD-Art)", "on_view": false, "gallery": "", "as_of": "2026-07", "license": "Public Domain (PD-Art / CC Public Domain Mark 1.0)", "license_short": "PD", "credit": "Berlinische Galerie, Berlin (BG-M 2302/80-2/6)", "blurb": "Painted for a grand villa’s dining room, the panicked suitors scramble and tumble as the true king of Ithaca reclaims his home.", "caption": "Notice the rose garlands still crowning the suitors as they fight: Corinth catches them mid-feast, snatching up a stool and a table because Odysseus had the hall's real weapons carried away (Od. 22.23-25). A garlanded body already sprawls at lower right - the banquet has become a slaughter.", "line": 200, "museum_url": "https://www.wikidata.org/wiki/Q47517559", "file_page_url": "https://commons.wikimedia.org/wiki/File:1913_Corinth_Die_Freier_im_Kampf_gegen_Odysseus_anagoria.JPG"}, {"index": 180, "id": "berlinische-corinth-odysseus-suitors", "book": 22, "x": 10272, "y": 9682, "width": 800, "height": 800, "title": "Odysseus Fighting the Suitors", "creator": "Lovis Corinth", "date": "1913", "medium": "Tempera on canvas", "museum": "Berlinische Galerie", "city": "Berlin, Germany", "source_provider": "Wikimedia Commons (PD-Art)", "on_view": false, "gallery": "", "as_of": "2026-07", "license": "Public Domain (PD-Art / CC Public Domain Mark 1.0)", "license_short": "PD", "credit": "Berlinische Galerie, Berlin (BG-M 2302/80-1/6)", "blurb": "In Lovis Corinth’s big, stormy painting, Odysseus plants himself at the doorway and at last stands up to the suitors who took over his hall.", "caption": "Look at the calm armored woman standing behind the crouching archer: that is Athena in helmet and golden aegis while Odysseus looses the first arrows. Corinth sets her openly in the brawl, though Homer keeps her hidden, perched as a swallow on a roof-beam (Od. 22.239-240). His raw expressionist brushwork turns the hall into a scrum of bare limbs.", "line": 256, "museum_url": "https://www.wikidata.org/wiki/Q47518270", "file_page_url": "https://commons.wikimedia.org/wiki/File:1913_Corinth_Odysseus_im_Kampf_mit_den_Freiern_anagoria.JPG"}, {"index": 181, "id": "aic-77260", "book": 22, "x": 11072, "y": 9682, "width": 800, "height": 800, "title": "Ulysses Killing the Suitors", "creator": "John Flaxman, II, English, 1755-1826", "date": "n.d.", "medium": "Pen and black ink, over graphite, on tan wove paper, laid down on cream wove paper", "museum": "The Art Institute of Chicago", "city": "Chicago, USA", "source_provider": "The Art Institute of Chicago", "on_view": false, "gallery": "", "as_of": "2026-07", "license": "CC0 1.0 Universal Public Domain Dedication", "license_short": "CC0", "credit": "Sidney A. Kent Fund", "blurb": "Bow in hand at last, Odysseus turns on the suitors who feasted in his hall and courted his faithful wife.", "caption": "Bow in hand at last, Odysseus turns on the suitors who feasted in his hall and courted his faithful wife.", "line": 307, "museum_url": "https://www.artic.edu/artworks/77260", "file_page_url": "https://www.artic.edu/artworks/77260"}, {"index": 182, "id": "rijks-thulden-slaying-suitors", "book": 22, "x": 8672, "y": 10482, "width": 800, "height": 800, "title": "Odysseus Kills the Suitors with the Help of Telemachus", "creator": "Theodoor van Thulden, after Francesco Primaticcio", "date": "1632–1633", "medium": "Etching and engraving", "museum": "Rijksmuseum", "city": "Amsterdam, Netherlands", "source_provider": "Wikimedia Commons (CC0)", "on_view": false, "gallery": "", "as_of": "2026-07", "license": "CC0 1.0 Universal Public Domain Dedication", "license_short": "CC0", "credit": "Rijksmuseum, Amsterdam (RP-P-OB-66.772)", "blurb": "Home at last, Odysseus and his son Telemachus fight side by side to drive the greedy suitors out of the palace once and for all.", "caption": "Home at last, Odysseus and his son Telemachus fight side by side to drive the greedy suitors out of the palace once and for all.", "line": 345, "museum_url": "https://www.rijksmuseum.nl/en/collection/RP-P-OB-66.772", "file_page_url": "https://commons.wikimedia.org/wiki/File:Odysseus_doodt_de_vrijers_met_hulp_van_Telemachus_De_werken_van_Odysseus_(serietitel),_RP-P-OB-66.772.jpg"}, {"index": 183, "id": "mmfa-monsiau-suitors", "book": 22, "x": 9472, "y": 10482, "width": 800, "height": 800, "title": "Ulysses, after Returning to His Palace and Slaying Penelope’s Suitors, Orders the Women to Remove the Bodies", "creator": "Nicolas-André Monsiau", "date": "1791", "medium": "Oil on canvas", "museum": "Montreal Museum of Fine Arts", "city": "Montreal, Canada", "source_provider": "Montreal Museu
