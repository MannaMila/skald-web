allery": "", "as_of": "", "license": "Public domain / PD-old-100 / Public Domain Mark", "license_short": "PD", "credit": "", "blurb": "Feel the gap Tischbein leaves between them: Penelope sits drawn back on her chair, chin on hand, studying the stranger who says he is her husband, while Odysseus leans in under a red traveler's cap (Od. 23.85-110). The old nurse waits behind with a jug and a hound rests at his feet - the household holding its breath before she believes.", "caption": "Feel the gap Tischbein leaves between them: Penelope sits drawn back on her chair, chin on hand, studying the stranger who says he is her husband, while Odysseus leans in under a red traveler's cap (Od. 23.85-110). The old nurse waits behind with a jug and a hound rests at his feet - the household holding its breath before she believes.", "line": 93, "museum_url": "", "file_page_url": "https://commons.wikimedia.org/wiki/File:Odysseus_und_Penelope_(Tischbein).jpg"}, {"index": 186, "id": "met-359855", "book": 23, "x": 12740, "y": 9682, "width": 800, "height": 800, "title": "Penelope and Odysseus", "creator": "Ugo da Carpi", "date": "ca. 1520–27", "medium": "Chiaroscuro woodcut printed from three blocks in blue and gray", "museum": "The Metropolitan Museum of Art", "city": "New York, USA", "source_provider": "The Metropolitan Museum of Art", "on_view": false, "gallery": "", "as_of": "2026-07", "license": "CC0 1.0 Universal Public Domain Dedication", "license_short": "CC0", "credit": "Rogers Fund, 1922", "blurb": "In this old Italian print, faithful Penelope sits beside the husband she waited twenty years to hold again.", "caption": "Read the letters printed top and bottom - 'RAPHAEL VRBINAS' and 'PER VGO DA CARPI': this is a chiaroscuro woodcut by Ugo da Carpi after a Raphael design, not the anonymous later print older labels assumed. Ugo builds the whole scene from tone, printing three blue blocks so light seems to fall across the pensive Penelope and the man reaching toward her (Od. 23.85-110).", "line": 170, "museum_url": "https://www.metmuseum.org/art/collection/search/359855", "file_page_url": "https://www.metmuseum.org/art/collection/search/359855"}, {"index": 187, "id": "rijks-thulden-toward-the-bed", "book": 23, "x": 13540, "y": 9682, "width": 800, "height": 800, "title": "Odysseus and Penelope Walk Toward the Bed", "creator": "Theodoor van Thulden, after Francesco Primaticcio", "date": "1633", "medium": "Etching and engraving with letterpress text", "museum": "Rijksmuseum", "city": "Amsterdam, Netherlands", "source_provider": "Wikimedia Commons (CC0)", "on_view": false, "gallery": "", "as_of": "2026-07", "license": "CC0 1.0 Universal Public Domain Dedication", "license_short": "CC0", "credit": "Rijksmuseum, Amsterdam (BI-1883-1235-50)", "blurb": "Reunited at last, Odysseus and Penelope walk hand in hand to their famous olive-tree bed, talking late into the happy night.", "caption": "Plate 47 of Van Thulden's etched 'Works of Odysseus,' after Primaticcio's now-lost Fontainebleau frescoes, with a French couplet cut beneath the image. A candle lights the couple toward the bedchamber while a servant kneels to ready the bed - Homer's very ending, where the old nurse leads them by torchlight to the room they had not shared in twenty years (Od. 23.289-296).", "line": 239, "museum_url": "https://www.rijksmuseum.nl/en/collection/BI-1883-1235-50", "file_page_url": "https://commons.wikimedia.org/wiki/File:Odysseus_en_Penelope_op_weg_naar_bed_Les_Travaux_d'Ulysse_(serietitel)_De_werken_van_Odysseus_(serietitel),_BI-1883-1235-50.jpg"}, {"index": 188, "id": "met-253053", "book": 23, "x": 14340, "y": 9682, "width": 800, "height": 800, "title": "Terracotta plaque", "creator": "Unknown", "date": "ca. 460–450 BCE", "medium": "Terracotta", "museum": "The Metropolitan Museum of Art", "city": "New York, USA", "source_provider": "The Metropolitan Museum of Art", "on_view": true, "gallery": "Gallery 157", "as_of": "2026-07", "license": "CC0 1.0 Universal Public Domain Dedication", "license_short": "CC0", "credit": "Fletcher Fund, 1930", "blurb": "Pressed from clay when Athens was young, this plaque shows the long-awaited return of Odysseus to the wife who never stopped hoping.", "caption": "Pressed from clay when Athens was young, this plaque shows the long-awaited return of Odysseus to the wife who never stopped hoping.", "line": 287, "museum_url": "https://www.metmuseum.org/art/collection/search/253053", "file_page_url": "https://www.metmuseum.org/art/collection/search/253053"}, {"index": 189, "id": "met-251812", "book": 23, "x": 15140, "y": 9682, "width": 800, "height": 800, "title": "Terracotta plaque", "creator": "Unknown", "date": "ca. 450 BCE", "medium": "Terracotta", "museum": "The Metropolitan Museum of Art", "city": "New York, USA", "source_provider": "The Metropolitan Museum of Art", "on_view": true, "gallery": "Gallery 157", "as_of": "2026-07", "license": "CC0 1.0 Universal Public Domain Dedication", "license_short": "CC0", "credit": "Fletcher Fund, 1925", "blurb": "This small clay relief captures the moment every listener waits for: Odysseus home at last, after twenty years of war and wandering.", "caption": "This small clay relief captures the moment every listener waits for: Odysseus home at last, after twenty years of war and wandering.", "line": 344, "museum_url": "https://www.metmuseum.org/art/collection/search/251812", "file_page_url": "https://www.metmuseum.org/art/collection/search/251812"}, {"index": 190, "id": "rijks-thulden-reunion-penelope", "book": 23, "x": 11940, "y": 10482, "width": 800, "height": 800, "title": "Odysseus and Penelope Embrace", "creator": "Theodoor van Thulden, after Francesco Primaticcio", "date": "1632–1633", "medium": "Etching and engraving", "museum": "Rijksmuseum", "city": "Amsterdam, Netherlands", "source_provider": "Wikimedia Commons (CC0)", "on_view": false, "gallery": "", "as_of": "2026-07", "license": "CC0 1.0 Universal Public Domain Dedication", "license_short": "CC0", "credit": "Rijksmuseum, Amsterdam (RP-P-OB-66.777)", "blurb": "The long journey is over: Odysseus and Penelope wrap each other in a joyful embrace, together again in their own home at last.", "caption": "", "line": null, "museum_url": "https://www.rijksmuseum.nl/en/collection/RP-P-OB-66.777", "file_page_url": "https://commons.wikimedia.org/wiki/File:Odysseus_en_Penelope_omhelzen_elkaar_De_werken_van_Odysseus_(serietitel),_RP-P-OB-66.777.jpg"}, {"index": 191, "id": "rijks-thulden-penelope-doubts", "book": 23, "x": 12740, "y": 10482, "width": 800, "height": 800, "title": "Penelope Doubts the Identity of Odysseus", "creator": "Theodoor van Thulden, after Francesco Primaticcio", "date": "1632–1633", "medium": "Etching and engraving", "museum": "Rijksmuseum", "city": "Amsterdam, Netherlands", "source_provider": "Wikimedia Commons (CC0)", "on_view": false, "gallery": "", "as_of": "2026-07", "license": "CC0 1.0 Universal Public Domain Dedication", "license_short": "CC0", "credit": "Rijksmuseum, Amsterdam (RP-P-OB-66.780)", "blurb": "After twenty long years, wise Penelope carefully tests the ragged stranger to be truly certain he is her beloved husband come home.", "caption": "", "line": null, "museum_url": "https://www.rijksmuseum.nl/en/collection/RP-P-OB-66.780", "file_page_url": "https://commons.wikimedia.org/wiki/File:Penelope_twijfelt_aan_de_identiteit_van_Odysseus_De_werken_van_Odysseus_(serietitel),_RP-P-OB-66.780.jpg"}, {"index": 192, "id": "toledo-primaticcio-ulysses-penelope", "book": 23, "x": 13540, "y": 10482, "width": 800, "height": 800, "title": "Ulysses and Penelope", "creator": "Francesco Primaticcio", "date": "c. 1545", "medium": "Oil on canvas", "museum": "Toledo Museum of Art", "city": "Toledo, Ohio, USA", "source_provider": "Wikimedia Commons (PD-Art)", "on_view": false, "gallery": "", "as_of": "2026-07", "license": "Public Domain (PD-Art / CC Public Domain Mark 1.0)", "license_short": "PD", "credit": "Toledo Museum of Art", "blurb": "Reunited at last, Odysseus tenderly cups Penelope's chin as the couple stays up late sharing everything that happened over twenty years apart.", "caption": "", "line": null, "museum_url": "https://emuseum.toledomuseum.org/objects/54742", "file_page_url": "https://commons.wikimedia.org/wiki/File:Francesco_Primaticcio_-_Ulysses_and_Penelope_-_WGA18409.jpg"}, {"index": 193, "id": "cooperhewitt-giani-penelope-recognizes", "book": 23, "x": 14340, "y": 10482, "width": 800, "height": 800, "title": "Penelope Recognizes Ulysses", "creator": "Felice Giani", "date": "1800–1825", "medium": "Pen and brown ink over graphite on paper", "museum": "Cooper Hewitt, Smithsonian Design Museum", "city": "New York, USA", "source_provider": "Cooper Hewitt, Smithsonian Design Museum (CC0)", "on_view": false, "gallery": "", "as_of": "2026-07", "license": "CC0 1.0 Universal Public Domain Dedication", "license_short": "CC0", "credit": "Cooper Hewitt, Smithsonian Design Museum (1901-39-3325)", "blurb": "Giani sketches the happiest moment of the whole story: Penelope's arms flung wide as she finally knows the stranger is her Ulysses.", "caption": "", "line": null, "museum_url": "https://collection.cooperhewitt.org/objects/18122705/", "file_page_url": "https://collection.cooperhewitt.org/objects/18122705/"}, {"index": 194, "id": "vanthulden-way-to-laertes", "book": 24, "x": 16008, "y": 9682, "width": 800, "height": 800, "title": "Odysseus and Telemachus on the way to Laertes", "creator": "Theodoor van Thulden, after Francesco Primaticcio", "date": "1632–1633", "medium": "Etching and engraving", "museum": "Rijksmuseum", "city": "Amsterdam, Netherlands", "source_provider": "Wikimedia Commons (CC0)", "on_view": false, "gallery": "", "as_of": "2026-07", "license": "CC0 1.0 Universal Public Domain Dedication", "license_short": "CC0", "credit": "Rijksmuseum, Amsterdam (RP-P-OB-66.782)", "blurb": "Father and son Odysseus and Telemachus walk together through the countryside to find grandfather Laertes and share the happy news.", "caption": "Father and son Odysseus and Telemachus walk together through the countryside to find grandfather Laertes and share the happy news.", "line": 213, "museum_url": "https://www.rijksmuseum.nl/en/collection/RP-P-OB-66.782", "file_page_url": "https://commons.wikimedia.org/wiki/File:Odysseus_en_Telemachus_onderweg_naar_Laertes_De_werken_van_Odysseus_(serietitel),_RP-P-OB-66.782.jpg"}, {"index": 196, "id": "vanthulden-embraces-laertes", "book": 24, "x": 16808, "y": 9682, "width": 800, "height": 800, "title": "Odysseus embraces Laertes in his vineyard", "creator": "Theodoor van Thulden, after Francesco Primaticcio", "date": "1632–1633", "medium": "Etching and engraving", "museum": "Rijksmuseum", "city": "Amsterdam, Netherlands", "source_provider": "Wikimedia Commons (CC0)", "on_view": false, "gallery": "", "as_of": "2026-07", "license": "CC0 1.0 Universal Public Domain Dedication", "license_short": "CC0", "credit": "Rijksmuseum, Amsterdam (RP-P-OB-66.784)", "blurb": "Out in the quiet orchard, Odysseus throws his arms around his aged father Laertes, and the old man weeps with joy to have his son home.", "caption": "Out in the quiet orchard, Odysseus throws his arms around his aged father Laertes, and the old man weeps with joy to have his son home.", "line": 469, "museum_url": "https://www.rijksmuseum.nl/en/collection/RP-P-OB-66.784", "file_page_url": "https://commons.wikimedia.org/wiki/File:Odysseus_omhelst_Laërtes_in_zijn_wijngaard_De_werken_van_Odysseus_(serietitel),_RP-P-OB-66.784.jpg"}, {"index": 197, "id": "cooperhewitt-giani-minerva-peace", "book": 24, "x": 16008, "y": 10482, "width": 800, "height": 800, "title": "Minerva Orders Ulysses to Make Peace with the Suitors of Penelope", "creator": "Felice Giani", "date": "before 1805", "medium": "Pen and brown ink, brush and brown wash on paper", "museum": "Cooper Hewitt, Smithsonian Design Museum", "city": "New York, USA", "source_provider": "Wikimedia Commons (PD-Art)", "on_view": false, "gallery": "", "as_of": "2026-07", "license": "Public Domain (PD-Art / CC Public Domain Mark 1.0)", "license_short": "PD", "credit": "Cooper Hewitt, Smithsonian Design Museum (1901-39-3343)", "blurb": "In Giani’s swift sketch, the goddess Minerva sweeps in to end the quarrel, commanding peace so Ithaca can finally rest.", "caption": "Giani's brown-ink sketch stops the last battle in mid-blow: Athena sweeps in from the left with her arm flung out to freeze the fighters, while up in the clouds at top-left Zeus hurls the thunderbolt that ends it (Od. 24.528-548). Shields and bodies litter the ground, and the Italian caption below reads that Minerva orders the peace.", "line": 546, "museum_url": "https://collection.cooperhewitt.org/objects/18122831/", "file_page_url": "https://commons.wikimedia.org/wiki/File:Drawing,_Sheet_from_a_Sketchbook-_Minerva_Orders_Ulysses_to_Make_Peace_with_the_Suitors_of_Penelope_(Minerva_induce_Ulisse_alla_pace_con_i_Proci),_before_1805_(CH_18122831).jpg"}, {"index": 198, "id": "rijks-flaxman-hermes-suitors", "book": 24, "x": 16808, "y": 10482, "width": 800, "height": 800, "title": "Mercury Conducting the Souls of the Suitors to the Infernal Regions", "creator": "James Parker, after John Flaxman", "date": "1805", "medium": "Etching and stipple work on paper, mounted on an album leaf", "museum": "Rijksmuseum", "city": "Amsterdam, Netherlands", "source_provider": "Rijksmuseum (Public Domain Mark)", "on_view": false, "gallery": "", "as_of": "2026-07", "license": "Public Domain (PD-Art / CC Public Domain Mark 1.0)", "license_short": "PD", "credit": "Rijksmuseum, Amsterdam (RP-P-1975-75-74; persistent ID 200778144)", "blurb": "At the opening of Book 24, Hermes calls up the slain suitors’ souls and leads them toward Hades with his golden wand, the shades thinly squeaking like bats.", "caption": "", "line": null, "museum_url": "https://www.rijksmuseum.nl/nl/collectie/object/Mercurius-brengt-de-zielen-van-de-vrijers-naar-de-onderwereld--e65e7b01b69339de42566af7aae3b8fe", "file_page_url": "https://www.rijksmuseum.nl/nl/collectie/object/Mercurius-brengt-de-zielen-van-de-vrijers-naar-de-onderwereld--e65e7b01b69339de42566af7aae3b8fe"}, {"index": 199, "id": "met-249276", "book": null, "x": 17676, "y": 9682, "width": 800, "height": 800, "title": "Glass ring stone", "creator": "Unknown", "date": "3rd–2nd century BCE", "medium": "Glass, brown", "museum": "The Metropolitan Museum of Art", "city": "New York, USA", "source_provider": "The Metropolitan Museum of Art", "on_view": true, "gallery": "Gallery 171", "as_of": "2026-07", "license": "CC0 1.0 Universal Public Domain Dedication", "license_short": "CC0", "credit": "Gift of J. Pierpont Morgan, 1917", "blurb": "Carved into a gem no larger than a fingertip, Odysseus journeys on — small enough to wear on a ring and carry his story anywhere.", "caption": "", "line": null, "museum_url": "https://www.metmuseum.org/art/collection/search/249276", "file_page_url": "https://www.metmuseum.org/art/collection/search/249276"}, {"index": 200, "id": "met-253627", "book": null, "x": 17676, "y": 10482, "width": 800, "height": 800, "title": "Terracotta calyx-krater (bowl for mixing wine and water)", "creator": "Persephone Painter", "date": "ca. 440 BCE", "medium": "Terracotta", "museum": "The Metropolitan Museum of Art", "city": "New York, USA", "source_provider": "The Metropolitan Museum of Art", "on_view": true, "gallery": "Gallery 159", "as_of": "2026-07", "license": "CC0 1.0 Universal Public Domain Dedication", "license_short": "CC0", "credit": "Gift of Amelia E. White, 1941", "blurb": "Painted on a bowl for mixing wine at an Athenian feast, Odysseus appears among the figures of myth the Greeks lived alongside every day.", "caption": "", "line": null, "museum_url": "https://www.metmuseum.org/art/collection/search/253627", "file_page_url": "https://www.metmuseum.org/art/collection/search/253627"}]};
const passages={"books": {"1": {"roman": "I", "title": "Athena Visits Ithaca", "slug": "odyssey-01-athena-visits-ithaca", "excerpt": {"text": "The man for wisdom’s various arts renown’d,\nLong exercised in woes, O Muse! resound;\nWho, when his arms had wrought the destined fall\nOf sacred Troy, and razed her heaven-built wall,\nWandering from clime to clime, observant stray’d,\nTheir manners noted, and their states survey’d,", "source": "Alexander Pope, 1726", "lines": "Od. 1.1–3"}}, "2": {"roman": "II", "title": "Telemachus and the Assembly", "slug": "odyssey-02-telemachus-assembly", "excerpt": {"text": "So spake the Queen, and unsuspicious, we\nWith her request complied. Thenceforth, all day\nShe wove the ample web, and by the aid\nOf torches ravell'd it again at night.", "source": "William Cowper, 1791", "lines": "Od. 2.103–105"}}, "3": {"roman": "III", "title": "Telemachus at Pylos", "slug": "odyssey-03-telemachus-at-pylos", "excerpt": {"text": "The sacred sun, above the waters raised,\nThrough heaven’s eternal brazen portals blazed;\nAnd wide o’er earth diffused his cheering ray,\nTo gods and men to give the golden day.\nNow on the coast of Pyle the vessel falls,\nBefore old Neleus’ venerable walls.", "source": "Alexander Pope, 1726", "lines": "Od. 3.1–5"}}, "4": {"roman": "IV", "title": "Sparta and the Ambush", "slug": "odyssey-04-sparta-and-the-ambush", "excerpt": {"text": "But Jove-born Helen otherwise, meantime,\nEmploy'd, into the wine of which they drank\nA drug infused, antidote to the pains\nOf grief and anger, a most potent charm\nFor ills of ev'ry name.", "source": "William Cowper, 1791", "lines": "Od. 4.219–221"}}, "5": {"roman": "V", "title": "Calypso and the Raft", "slug": "odyssey-05-calypso-and-the-raft", "excerpt": {"text": "His nights beside her in the hollow grot,\nConstrain'd, and day by day the rocks among\nWhich lined the shore heart-broken sat, and oft\nWhile wistfully he eyed the barren Deep,\nWept, groaned, desponded, sigh'd, and wept again.", "source": "William Cowper, 1791", "lines": "Od. 5.154–158"}}, "6": {"roman": "VI", "title": "Nausicaa", "slug": "odyssey-06-nausicaa", "excerpt": {"text": "If from the skies a goddess, or if earth\n(Imperial virgin) boast thy glorious birth,\nTo thee I bend! If in that bright disguise\nThou visit earth, a daughter of the skies,\nHail, Dian, hail! the huntress of the groves\nSo shines majestic, and so stately moves,", "source": "Alexander Pope, 1726", "lines": "Od. 6.149–152"}}, "7": {"roman": "VII", "title": "The Palace of Alcinous", "slug": "odyssey-07-palace-of-alcinous", "excerpt": {"text": "There grew luxuriant many a lofty tree,\nPomegranate, pear, the apple blushing bright,\nThe honied fig, and unctuous olive smooth.", "source": "William Cowper, 1791", "lines": "Od. 7.114–116"}}, "8": {"roman": "VIII", "title": "Games and Songs", "slug": "odyssey-08-games-and-songs", "excerpt": {"text": "So sang the bard illustrious, at whose song\nUlysses melted, and tear after tear\nFell on his cheeks. As when a woman weeps,\nHer husband, who hath fallen in defence\nOf his own city and his babes before\nThe gates; she, sinking, folds him in her arms", "source": "William Cowper, 1791", "lines": "Od. 8.521–527"}}, "9": {"roman": "IX", "title": "Cicones, Lotus-Eaters, and Cyclops", "slug": "odyssey-09-cicones-lotus-cyclops", "excerpt": {"text": "I am Ulysses, fear'd in all the earth\nFor subtlest wisdom, and renown'd to heaven,\nThe offspring of Laertes; my abode\nIs sun-burnt Ithaca; there waving stands\nThe mountain Neritus his num'rous boughs,", "source": "William Cowper, 1791", "lines": "Od. 9.19–22"}}, "10": {"roman": "X", "title": "Aeolus, Laestrygonians, and Circe", "slug": "odyssey-10-aeolus-laestrygonians-circe", "excerpt": {"text": "Low in a vale, but on an open spot,\nThey found the splendid house of Circe, built\nWith hewn and polish'd stones; compass'd she dwelt\nBy lions on all sides and mountain-wolves\nTamed by herself with drugs of noxious pow'rs.", "source": "William Cowper, 1791", "lines": "Od. 10.210–213"}}, "11": {"roman": "XI", "title": "The Land of the Dead", "slug": "odyssey-11-land-of-the-dead", "excerpt": {"text": "When lo! appear’d along the dusky coasts,\nThin, airy shoals of visionary ghosts:\nFair, pensive youths, and soft enamour’d maids;\nAnd wither’d elders, pale and wrinkled shades;\nGhastly with wounds the forms of warriors slain\nStalk’d with majestic port, a martial train:", "source": "Alexander Pope, 1726", "lines": "Od. 11.36–41"}}, "12": {"roman": "XII", "title": "Sirens, Scylla, and the Sun Cattle", "slug": "odyssey-12-sirens-scylla-sun-cattle", "excerpt": {"text": "Oh stay, O pride of Greece! Ulysses, stay!\nOh cease thy course, and listen to our lay!\nBlest is the man ordain’d our voice to hear,\nThe song instructs the soul, and charms the ear.", "source": "Alexander Pope, 1726", "lines": "Od. 12.184–188"}}, "13": {"roman": "XIII", "title": "Return to Ithaca", "slug": "odyssey-13-return-to-ithaca", "excerpt": {"text": "All objects, therefore, in the Hero's eyes\nSeem'd alien, foot-paths long, commodious ports,\nHeav'n-climbing rocks, and trees of amplest growth.\nArising, fixt he stood, his native soil\nContemplating, till with expanded palms\nBoth thighs he smote, and, plaintive, thus began.", "source": "William Cowper, 1791", "lines": "Od. 13.194–199"}}, "14": {"roman": "XIV", "title": "Eumaeus", "slug": "odyssey-14-eumaeus", "excerpt": {"text": "It never was our guise\nTo slight the poor, or aught humane despise:\nFor Jove unfolds our hospitable door,\n’Tis Jove that sends the stranger and the poor,", "source": "Alexander Pope, 1726", "lines": "Od. 14.56–58"}}, "15": {"roman": "XV", "title": "Telemachus Returns", "slug": "odyssey-15-telemachus-returns", "excerpt": {"text": "There is an island (thou hast heard, perchance,\nOf such an isle) named Syria; it is placed\nAbove Ortigia, and a dial owns\nTrue to the tropic changes of the year.\nNo great extent she boasts, yet is she rich\nIn cattle and in flocks, in wheat and wine.", "source": "William Cowper, 1791", "lines": "Od. 15.403–406"}}, "16": {"roman": "XVI", "title": "Father and Son", "slug": "odyssey-16-father-and-son", "excerpt": {"text": "Then threw Telemachus\nHis arms around his father's neck, and wept.\nDesire intense of lamentation seized\nOn both; soft murmurs utt'ring, each indulged\nHis grief, more frequent wailing than the bird,\n(Eagle, or hook-nail'd vulture) from whose nest\nSome swain hath stol'n her yet unfeather'd young.", "source": "William Cowper, 1791", "lines": "Od. 16.213–219"}}, "17": {"roman": "XVII", "title": "The Palace Beggar", "slug": "odyssey-17-palace-beggar", "excerpt": {"text": "Thus, near the gates conferring as they drew,\nArgus, the dog, his ancient master knew:\nHe not unconscious of the voice and tread,\nLifts to the sound his ear, and rears his head;", "source": "Alexander Pope, 1726", "lines": "Od. 17.290–293"}}, "18": {"roman": "XVIII", "title": "The Beggar Fight", "slug": "odyssey-18-beggar-fight", "excerpt": {"text": "No creature weak as man; for while the Gods\nGrant him prosperity and health, no fear\nHath he, or thought, that he shall ever mourn;\nBut when the Gods with evils unforeseen\nSmite him, he bears them with a grudging mind;", "source": "William Cowper, 1791", "lines": "Od. 18.130–135"}}, "19": {"roman": "XIX", "title": "Penelope and the Scar", "slug": "odyssey-19-penelope-and-the-scar", "excerpt": {"text": "As snows collected on the mountain freeze;\nWhen milder regions breathe a vernal breeze,\nThe fleecy pile obeys the whispering gales,\nEnds in a stream, and murmurs through the vales:\nSo, melting with the pleasing tale he told,\nDown her fair cheek the copious torrent roll’d:", "source": "Alexander Pope, 1726", "lines": "Od. 19.204–209"}}, "20": {"roman": "XX", "title": "Omens Before the Bow", "slug": "odyssey-20-omens-before-the-bow", "excerpt": {"text": "Poor suffering heart! (he cried,) support the pain\nOf wounded honour, and thy rage restrain.\nNot fiercer woes thy fortitude could foil,\nWhen the brave partners of thy ten years’ toil\nDire Polypheme devour’d;", "source": "Alexander Pope, 1726", "lines": "Od. 20.18–21"}}, "21": {"roman": "XXI", "title": "The Bow of Odysseus", "slug": "odyssey-21-bow-of-odysseus", "excerpt": {"text": "Then, as some heavenly minstrel, taught to sing\nHigh notes responsive to the trembling string,\nTo some new strain when he adapts the lyre,\nOr the dumb lute refits with vocal wire,", "source": "Alexander Pope, 1726", "lines": "Od. 21.406–409"}}, "22": {"roman": "XXII", "title": "The Suitors Fall", "slug": "odyssey-22-suitors-fall", "excerpt": {"text": "Then fierce the hero o’er the threshold strode;\nStripp’d of his rags, he blazed out like a god.\nFull in their face the lifted bow he bore,\nAnd quiver’d deaths, a formidable store;", "source": "Alexander Pope, 1726", "lines": "Od. 22.1–4"}}, "23": {"roman": "XXIII", "title": "Penelope Tests Odysseus", "slug": "odyssey-23-penelope-test", "excerpt": {"text": "So welcome in her eyes Ulysses seem'd,\nAround whose neck winding her snowy arms,\nShe clung as she would loose him never more.", "source": "William Cowper, 1791", "lines": "Od. 23.239–240"}}, "24": {"roman": "XXIV", "title": "Peace in Ithaca", "slug": "odyssey-24-peace-in-ithaca", "excerpt": {"text": "As when the bats within some hallow'd cave\nFlit squeaking all around, for if but one\nFall from the rock, the rest all follow him,\nIn such connexion mutual they adhere,\nSo, after bounteous Mercury, the ghosts,\nTroop'd downward gibb'ring all the dreary way.", "source": "William Cowper, 1791", "lines": "Od. 24.6–10"}}}, "anchors": {"rembrandthuis-lastman-odysseus-minerva": {"book": 1, "line": 3, "text": "A Wand'rer, after Ilium overthrown,\nDiscover'd various cities, and the mind\nAnd manners learn'd of men, in lands remote.\nHe num'rous woes on Ocean toss'd, endured,", "source": "William Cowper, 1791", "ref": "Od. 1.3"}, "brighton-kauffmann-penelope-loom": {"book": 1, "line": 48, "text": "And well he merited the death he found;\nSo perish all, who shall, like him, offend.\nBut with a bosom anguish-rent I view\nUlysses, hapless Chief! who from his friends", "source": "William Cowper, 1791", "ref": "Od. 1.48"}, "rijks-tilliard-athena-protects-telemachus": {"book": 1, "line": 93, "text": "And into sandy Pylus, there to hear\n(If hear he may) some tidings of his Sire,\nAnd to procure himself a glorious name.\nThis said, her golden sandals to her feet", "source": "William Cowper, 1791", "ref": "Od. 1.93"}, "odyssey-01-athena-visits-ithaca-plate-07-penelope": {"book": 1, "line": 104, "text": "Mentes she seem'd, the hospitable Chief\nOf Taphos' isle—she found the haughty throng\nThe suitors; they before the palace gate\nWith iv'ry cubes sported, on num'rous hides", "source": "William Cowper, 1791", "ref": "Od. 1.104"}, "odyssey-01-athena-visits-ithaca-plate-01-athena": {"book": 1, "line": 125, "text": "Beneath the lofty roof, placed her bright spear\nWithin a pillar's cavity, long time\nThe armoury where many a spear had stood,\nBright weapons of his own illustrious Sire.", "source": "William Cowper, 1791", "ref": "Od. 1.125"}, "met-436809": {"book": 1, "line": 178, "text": "Mentes, the offspring of a Chief renown'd\nIn war, Anchialus; and I rule, myself,\nAn island race, the Taphians oar-expert.\nWith ship and mariners I now arrive,", "source": "William Cowper, 1791", "ref": "Od. 1.178"}, "aberdeen-waterhouse-penelope-suitors": {"book": 1, "line": 215, "text": "Would I had been son of some happier Sire,\nOrdain'd in calm possession of his own\nTo reach the verge of life. But now, report\nProclaims me his, whom I of all mankind", "source": "William Cowper, 1791", "ref": "Od. 1.215"}, "rijks-tilliard-telemachus-mentor": {"book": 1, "line": 322, "text": "Amazed he stood, and, in his secret thought\nRevolving all, believed his guest a God.\nThe youthful Hero to the suitors then\nRepair'd; they silent, listen'd to the song", "source": "William Cowper, 1791", "ref": "Od. 1.322"}, "cooperhewitt-dufour-telemachus-wallpaper": {"book": 1, "line": 333, "text": "The portal of her stately mansion stood,\nBetween her maidens, with her lucid veil\nHer lovely features mantling. There, profuse\nShe wept, and thus the sacred bard bespake.", "source": "William Cowper, 1791", "ref": "Od. 1.333"}, "met-253348": {"book": 1, "line": 357, "text": "Especially to me, chief ruler here.\nShe heard astonish'd; and the prudent speech\nReposing of her son deep in her heart,\nAgain with her attendant maidens sought", "source": "William Cowper, 1791", "ref": "Od. 1.357"}, "berlin-mourning-penelope-sk603": {"book": 1, "line": 442, "text": "Drew by its silver ring the portal close,\nAnd fasten'd it with bolt and brace secure.\nThere lay Telemachus, on finest wool\nReposed, contemplating all night his course", "source": "William Cowper, 1791", "ref": "Od. 1.442"}, "odyssey-02-telemachus-assembly-plate-06-suitors": {"book": 2, "line": 106, "text": "Else I the censure dread of all my sex,\nShould he, so wealthy, want at last a shroud.\nSo spake the Queen, and unsuspicious, we\nWith her request complied. Thenceforth, all day", "source": "William Cowper, 1791", "ref": "Od. 2.106"}, "pinakothek-hele-penelope": {"book": 2, "line": 129, "text": "So long thy patrimony and thy goods,\nAs she her present purpose shall indulge,\nWith which the Gods inspire her. Great renown\nShe to herself insures, but equal woe", "source": "William Cowper, 1791", "ref": "Od. 2.129"}, "bnf-denon-penelope-night": {"book": 2, "line": 137, "text": "Antinoüs! it is not possible\nThat I should thrust her forth against her will,\nWho both produced and reared me. Be he dead,\nOr still alive, my Sire is far remote,", "source": "William Cowper, 1791", "ref": "Od. 2.137"}, "met-436970": {"book": 2, "line": 177, "text": "No few shall share, inhabitants with us\nOf pleasant Ithaca; but let us frame\nEffectual means maturely to suppress\nTheir violent deeds, or rather let themselves", "source": "William Cowper, 1791", "ref": "Od. 2.177"}, "getty-penelope-web": {"book": 2, "line": 183, "text": "Of all which when Ulysses with the Greeks\nEmbark'd for Troy, I to himself foretold.\nI said that, after many woes, and loss\nOf all his people, in the twentieth year,", "source": "William Cowper, 1791", "ref": "Od. 2.183"}, "man-meleager-nestor-sacrifice": {"book": 3, "line": 34, "text": "The viands, some, transfix'd them with the spits.\nThey seeing guests arrived, together all\nAdvanced, and, grasping courteously their hands,\nInvited them to sit; but first, the son", "source": "William Cowper, 1791", "ref": "Od. 3.34"}, "flaxman-athena-guides-telemachus": {"book": 3, "line": 64, "text": "Accomplish'd. To Telemachus she gave\nThe splendid goblet next, and in his turn\nLike pray'r Ulysses' son also preferr'd.\nAnd now (the banquet from the spits withdrawn)", "source": "William Cowper, 1791", "ref": "Od. 3.64"}, "rijks-telemachus-nestor-pylos": {"book": 3, "line": 102, "text": "Now his fidelity, and tell me true.\nThen Nestor thus Gerenian Hero old.\nYoung friend! since thou remind'st me, speaking thus,\nOf all the woes which indefatigable", "source": "William Cowper, 1791", "ref": "Od. 3.102"}, "met-240552": {"book": 3, "line": 325, "text": "To which I counsel thee; for he hath come\nOf late from distant lands, whence to escape\nNo man could hope, whom tempests first had driv'n\nDevious into so wide a sea, from which", "source": "William Cowper, 1791", "ref": "Od. 3.325"}, "flaxman-nestor-sacrifice-pylos": {"book": 3, "line": 406, "text": "The consort Queen had diligent prepar'd.\nBut when Aurora, daughter of the dawn,\nHad tinged the East, arising from his bed,\nGerenian Nestor issued forth, and sat", "source": "William Cowper, 1791", "ref": "Od. 3.406"}, "odyssey-03-telemachus-at-pylos-plate-04-telemachus-departing-nestor": {"book": 3, "line": 450, "text": "Enter'd, and senseless on the floor he fell.\nThen Nestor's daughters, and the consorts all\nOf Nestor's sons, with his own consort, chaste\nEurydice, the daughter eldest-born", "source": "William Cowper, 1791", "ref": "Od. 3.450"}, "met-247384": {"book": 4, "line": 131, "text": "Whose mansion in Ægyptian Thebes is rich\nIn untold treasure, and who gave, himself,\nTen golden talents, and two silver baths\nTo Menelaus, with two splendid tripods", "source": "William Cowper, 1791", "ref": "Od. 4.131"}, "hermitage-lagrenee-helen-telemachus": {"book": 4, "line": 235, "text": "Had fall'n in battle, and before his eyes.\nSuch drugs Jove's daughter own'd, with skill prepar'd,\nAnd of prime virtue, by the wife of Thone,\nÆgyptian Polydamna, giv'n her.", "source": "William Cowper, 1791", "ref": "Od. 4.235"}, "met-469712": {"book": 4, "line": 456, "text": "Loud-shouting flew on him, and in our arms\nConstrain'd him fast; nor the sea-prophet old\nCall'd not incontinent his shifts to mind.\nFirst he became a long-maned lion grim,", "source": "William Cowper, 1791", "ref": "Od. 4.456"}, "met-436810": {"book": 4, "line": 551, "text": "Is still detain'd; I dread, yet wish to hear.\nSo I; to whom thus Proteus in return.\nLaertes' son, the Lord of Ithaca—\nHim in an island weeping I beheld,", "source": "William Cowper, 1791", "ref": "Od. 4.551"}, "odyssey-04-sparta-and-the-ambush-plate-07-brueghel-calypso": {"book": 4, "line": 589, "text": "From that same cup, thou may'st remember me.\nHim, prudent, then answer'd Telemachus.\nAtrides, seek not to detain me here\nLong time; for though contented I could sit", "source": "William Cowper, 1791", "ref": "Od. 4.589"}, "hallwyl-poelenburgh-calypso": {"book": 4, "line": 622, "text": "While all their wives, their brows with frontlets bound,\nCame charg'd with bread. Thus busy they prepared\nA banquet in the mansion of the King.\nMeantime, before Ulysses' palace gate", "source": "William Cowper, 1791", "ref": "Od. 4.622"}, "odyssey-05-calypso-and-the-raft-plate-01-hermes": {"book": 5, "line": 74, "text": "Hermes, Heav'n's messenger, admiring stood\nThat sight, and having all survey'd, at length\nEnter'd the grotto; nor the lovely nymph\nHim knew not soon as seen, for not unknown", "source": "William Cowper, 1791", "ref": "Od. 5.74"}, "basel-bocklin-odysseus-calypso": {"book": 5, "line": 151, "text": "Constrain'd, and day by day the rocks among\nWhich lined the shore heart-broken sat, and oft\nWhile wistfully he eyed the barren Deep,\nWept, groaned, desponded, sigh'd, and wept again.", "source": "William Cowper, 1791", "ref": "Od. 5.151"}, "cleveland-lairesse-calypso-1992-2": {"book": 5, "line": 156, "text": "In anguish; go; thou hast my glad consent.\nArise to labour; hewing down the trunks\nOf lofty trees, fashion them with the ax\nTo a broad raft, which closely floor'd above,", "source": "William Cowper, 1791", "ref": "Od. 5.156"}, "rijks-thulden-odysseus-calypso-raft": {"book": 5, "line": 243, "text": "The knotted surface chipping by a line.\nMeantime the lovely Goddess to his aid\nSharp augres brought, with which he bored the beams,\nThen, side by side placing them, fitted each", "source": "William Cowper, 1791", "ref": "Od. 5.243"}, "rijks-thulden-neptune-storm": {"book": 5, "line": 279, "text": "Like a broad buckler on the waves afloat.\nBut Neptune, now returning from the land\nOf Ethiopia, mark'd him on his raft\nSkimming the billows, from the mountain-tops", "source": "William Cowper, 1791", "ref": "Od. 5.279"}, "met-818422": {"book": 5, "line": 351, "text": "Headlong, was hidden by the closing flood.\nBut still Ulysses sat perplex'd, and thus\nThe toil-enduring Hero reason'd sad.\nAlas! I tremble lest some God design", "source": "William Cowper, 1791", "ref": "Od. 5.351"}, "odyssey-06-nausicaa-plate-01-nausikaa": {"book": 6, "line": 50, "text": "Awaken'd fair Nausicaa; she her dream\nRemember'd wond'ring, and her parents sought\nAnxious to tell them. Them she found within.\nBeside the hearth her royal mother sat,", "source": "William Cowper, 1791", "ref": "Od. 6.50"}, "met-247898": {"book": 6, "line": 100, "text": "Their head-attire, play'd wanton with the ball,\nThe princess singing to her maids the while.\nSuch as shaft-arm'd Diana roams the hills,\nTäygetus sky-capt, or Erymanth,", "source": "William Cowper, 1791", "ref": "Od. 6.100"}, "capodimonte-desubleo-ulysses-nausicaa": {"book": 6, "line": 124, "text": "With voice articulate? But what avails\nTo ask; I will myself go forth and see.\nSo saying, divine Ulysses from beneath\nHis thicket crept, and from the leafy wood", "source": "William Cowper, 1791", "ref": "Od. 6.124"}, "pinakothek-lastman-odysseus-nausicaa": {"book": 6, "line": 135, "text": "Reluctant, by necessity constrain'd.\nHim foul with sea foam horror-struck they view'd,\nAnd o'er the jutting shores fled all dispersed.\nNausicaa alone fled not; for her", "source": "William Cowper, 1791", "ref": "Od. 6.135"}, "noordbrabants-jordaens-nausicaa": {"book": 6, "line": 162, "text": "Such erst, in Delos, I beheld a palm\nBeside the altar of Apollo, tall,\nAnd growing still; (for thither too I sail'd,\nAnd num'rous were my followers in a voyage", "source": "William Cowper, 1791", "ref": "Od. 6.162"}, "rijks-jordaens-odysseus-nausicaa": {"book": 6, "line": 195, "text": "Nor garment thou shalt want, nor aught beside\nDue to a suppliant guest like thee forlorn.\nI will both show thee where our city stands,\nAnd who dwell here. Phæacia's sons possess", "source": "William Cowper, 1791", "ref": "Od. 6.195"}, "odyssey-06-nausicaa-plate-03-eddelien-shipwreck": {"book": 6, "line": 211, "text": "To such are welcome. Bring ye therefore food\nAnd wine, my maidens, for the guest's regale,\nAnd lave him where the stream is shelter'd most.\nShe spake; they stood, and by each other's words", "source": "William Cowper, 1791", "ref": "Od. 6.211"}, "aberdeen-emerson-nausicaa": {"book": 6, "line": 216, "text": "O'erhung the stream, as fair Nausicaa bade,\nDaughter of King Alcinoüs the renown'd.\nApparel also at his side they spread,\nMantle and vest, and, next, the limpid oil", "source": "William Cowper, 1791", "ref": "Od. 6.216"}, "paleis-keyser-odysseus-nausicaa": {"book": 6, "line": 224, "text": "But in your presence I bathe not, ashamed\nTo show myself uncloath'd to female eyes.\nHe said; they went, and to Nausicaa told\nHis answer; then the Hero in the stream", "source": "William Cowper, 1791", "ref": "Od. 6.224"}, "lacma-rosa-odysseus-nausicaa": {"book": 6, "line": 251, "text": "Toil-suff'ring Chief, and drank, for he had lived\nFrom taste of aliment long time estranged.\nOn other thoughts meantime intent, her charge\nOf folded vestments neat the Princess placed", "source": "William Cowper, 1791", "ref": "Od. 6.251"}, "cleveland-daumier-nausicaa-1965-540": {"book": 6, "line": 259, "text": "Where all Phæacia's Nobles thou shalt see.\nBut thou (for I account thee not unwise)\nThis course pursue. While through the fields we pass,\nAnd labours of the rural hind, so long", "source": "William Cowper, 1791", "ref": "Od. 6.259"}, "aic-81883": {"book": 6, "line": 329, "text": "Benevolence and pity of my woes!\nHe spake, whose pray'r well-pleas'd the Goddess heard,\nBut, rev'rencing the brother of her sire,\nAppear'd not to Ulysses yet, whom he", "source": "William Cowper, 1791", "ref": "Od. 6.329"}, "nationalmuseum-malmstrom-odysseus-alcinous": {"book": 7, "line": 142, "text": "Around Areta's knees his arms he cast,\nAnd, in that moment, broken clear away\nThe cloud all went, shed on him from above.\nDumb sat the guests, seeing the unknown Chief,", "source": "William Cowper, 1791", "ref": "Od. 7.142"}, "flaxman-nausicaa-leads-odysseus-palace": {"book": 7, "line": 179, "text": "And to his herald thus Alcinoüs spake.\nPontonoüs! mingling wine, bear it around\nTo ev'ry guest in turn, that we may pour\nTo thunder-bearer Jove, the stranger's friend,", "source": "William Cowper, 1791", "ref": "Od. 7.179"}, "bancaditalia-hayez-alcinous": {"book": 7, "line": 186, "text": "Sufficient, then, Alcinoüs thus began.\nPhæacian Chiefs and Senators, I speak\nThe dictates of my mind, therefore attend!\nYe all have feasted—To your homes and sleep.", "source": "William Cowper, 1791", "ref": "Od. 7.186"}, "odyssey-08-games-and-songs-plate-08-morning": {"book": 8, "line": 3, "text": "Blush'd in the East, then from his bed arose\nThe sacred might of the Phæacian King.\nThen uprose also, city-waster Chief,\nUlysses, whom the King Alcinoüs", "source": "William Cowper, 1791", "ref": "Od. 8.3"}, "rijks-thulden-sacrifice-to-gods": {"book": 8, "line": 59, "text": "Administ'ring, prepared the joyous feast.\nAnd now the herald came, leading with care\nThe tuneful bard; dear to the muse was he,\nWho yet appointed him both good and ill;", "source": "William Cowper, 1791", "ref": "Od. 8.59"}, "flaxman-demodocus-sings": {"book": 8, "line": 83, "text": "Ulysses drew, behind its ample folds\nVeiling his face, through fear to be observed\nBy the Phæacians weeping at the song;\nAnd ever as the bard harmonious ceased,", "source": "William Cowper, 1791", "ref": "Od. 8.83"}, "capodimonte-hayez-court-of-alcinous": {"book": 8, "line": 101, "text": "At home arriv'd, that none like us have learn'd\nTo leap, to box, to wrestle, and to run.\nSo saying, he led them forth, whose steps the guests\nAll follow'd, and the herald hanging high", "source": "William Cowper, 1791", "ref": "Od. 8.101"}, "met-248902": {"book": 8, "line": 120, "text": "Laodamas, his eldest; Halius, next,\nHis second-born; and godlike Clytoneus.\nOf these, some started for the runner's prize.\nThey gave the race its limits. All at once", "source": "William Cowper, 1791", "ref": "Od. 8.120"}, "met-198825": {"book": 8, "line": 296, "text": "He spake, nor she was loth, but bedward too\nLike him inclined; so then, to bed they went,\nAnd as they lay'd them down, down stream'd the net\nAround them, labour exquisite of hands", "source": "William Cowper, 1791", "ref": "Od. 8.296"}, "massimo-discobolus-castelporziano": {"book": 8, "line": 327, "text": "And, regent of the far-commanding bow,\nApollo also came; but chaste reserve\nBashful kept all the Goddesses at home.\nThe Gods, by whose beneficence all live,", "source": "William Cowper, 1791", "ref": "Od. 8.327"}, "rijks-thulden-zephyrus-ship": {"book": 8, "line": 471, "text": "The feast to all, and charg'd the cups with wine,\nAnd introducing by his hand the bard\nPhæacia's glory, at the column's side\nThe herald placed Demodocus again.", "source": "William Cowper, 1791", "ref": "Od. 8.471"}, "met-254896": {"book": 8, "line": 499, "text": "Apollo free imparts celestial song.\nHe ended; then Apollo with full force\nRush'd on Demodocus, and he began\nWhat time the Greeks, first firing their own camp", "source": "William Cowper, 1791", "ref": "Od. 8.499"}, "aic-142544": {"book": 8, "line": 584, "text": "Are next and dearest to us after those\nWho share our own descent; or was the dead\nThy bosom-friend, whose heart was as thy own?\nFor worthy as a brother of our love", "source": "William Cowper, 1791", "ref": "Od. 8.584"}, "aic-110760": {"book": 9, "line": 31, "text": "Elsewhere, an object dear and sweet as she.\nCalypso, beauteous Goddess, in her grot\nDetain'd me, wishing me her own espoused;\nÆæan Circe also, skill'd profound", "source": "William Cowper, 1791", "ref": "Od. 9.31"}, "rijks-thulden-lotus-eaters": {"book": 9, "line": 64, "text": "Our friends, whom the Ciconians had destroy'd.\nBut cloud-assembler Jove assail'd us soon\nWith a tempestuous North-wind; earth alike\nAnd sea with storms he overhung, and night", "source": "William Cowper, 1791", "ref": "Od. 9.64"}, "cooperhewitt-giani-ulysses-escape": {"book": 9, "line": 83, "text": "On sweetest fruit alone. There quitting ship,\nWe landed and drew water, and the crews\nBeside the vessels took their ev'ning cheer.\nWhen, hasty, we had thus our strength renew'd,", "source": "William Cowper, 1791", "ref": "Od. 9.83"}, "mfa-bocklin-odysseus-polyphemus": {"book": 9, "line": 102, "text": "In order, thresh'd with oars the foamy flood.\nThence, o'er the Deep proceeding sad, we reach'd\nThe land at length, where, giant-sized and free\nFrom all constraint of law, the Cyclops dwell.", "source": "William Cowper, 1791", "ref": "Od. 9.102"}, "odyssey-09-cicones-lotus-cyclops-plate-06-rams": {"book": 9, "line": 116, "text": "Inured to winter's cold and hunger, roams\nThe dreary woods, or mountain-tops sublime;\nNo fleecy flocks dwell there, nor plough is known,\nBut the unseeded and unfurrow'd soil,", "source": "William Cowper, 1791", "ref": "Od. 9.116"}, "boijmans-stradanus-polyphemus": {"book": 9, "line": 202, "text": "A single cup with twenty from the stream,\nAnd, even then, the beaker breath'd abroad\nA scent celestial, which whoever smelt,\nThenceforth no pleasure found it to abstain.", "source": "William Cowper, 1791", "ref": "Od. 9.202"}, "odyssey-09-cicones-lotus-cyclops-plate-02-polyphemos": {"book": 9, "line": 307, "text": "His fatted flocks abroad, moving with ease\nThat pond'rous barrier, and replacing it\nAs he had only closed a quiver's lid.\nThen, hissing them along, he drove his flocks", "source": "William Cowper, 1791", "ref": "Od. 9.307"}, "rijks-thulden-blinding-polyphemus": {"book": 9, "line": 412, "text": "That by the fiction only of a name,\nSlight stratagem! I had deceived them all.\nThen groan'd the Cyclops wrung with pain and grief,\nAnd, fumbling, with stretch'd hands, removed the rock", "source": "William Cowper, 1791", "ref": "Od. 9.412"}, "odyssey-09-cicones-lotus-cyclops-plate-05-cave": {"book": 9, "line": 423, "text": "Who strove for life, conscious of woe at hand.\nTo me, thus meditating, this appear'd\nThe likeliest course. The rams well-thriven were,\nThick-fleeced, full-sized, with wool of sable hue.", "source": "William Cowper, 1791", "ref": "Od. 9.423"}, "odyssey-09-cicones-lotus-cyclops-plate-07-ship": {"book": 9, "line": 490, "text": "Back thrust her from the coast and by a nod\nIn silence given, bade my companions ply\nStrenuous their oars, that so we might escape.\nProcumbent, each obey'd, and when, the flood", "source": "William Cowper, 1791", "ref": "Od. 9.490"}, "ng-turner-ulysses": {"book": 9, "line": 564, "text": "To climb their barks, and cast the hawsers loose.\nThey all obedient, took their seats on board\nWell-ranged, and thresh'd with oars the foamy flood.\nThus, 'scaping narrowly, we roam'd the Deep", "source": "William Cowper, 1791", "ref": "Od. 9.564"}, "tesse-moillon-aeolus-winds": {"book": 10, "line": 3, "text": "Æolus, son of Hippotas, belov'd\nBy the Immortals, in an isle afloat.\nA brazen wall impregnable on all sides\nGirds it, and smooth its rocky coast ascends.", "source": "William Cowper, 1791", "ref": "Od. 10.3"}, "met-818319": {"book": 10, "line": 14, "text": "A month complete he, friendly, at his board\nRegaled me, and enquiry made minute\nOf Ilium's fall, of the Achaian fleet,\nAnd of our voyage thence. I told him all.", "source": "William Cowper, 1791", "ref": "Od. 10.14"}, "rijks-thulden-bag-of-winds": {"book": 10, "line": 52, "text": "To endure my sorrows, and content to live.\nI calm endured them; but around my head\nWinding my mantle, lay'd me down below,\nWhile adverse blasts bore all my fleet again", "source": "William Cowper, 1791", "ref": "Od. 10.52"}, "boijmans-stradanus-aeolus": {"book": 10, "line": 87, "text": "By day, close border, both, the city-walls.\nTo that illustrious port we came, by rocks\nUninterrupted flank'd on either side\nOf tow'ring height, while prominent the shores", "source": "William Cowper, 1791", "ref": "Od. 10.87"}, "odyssey-10-aeolus-laestrygonians-circe-plate-05-laestrygonians-i": {"book": 10, "line": 93, "text": "Then moor'd them side by side; for never surge\nThere lifts its head, or great or small, but clear\nWe found, and motionless, the shelter'd flood.\nMyself alone, staying my bark without,", "source": "William Cowper, 1791", "ref": "Od. 10.93"}, "bnf-thulden-laestrygonians": {"book": 10, "line": 133, "text": "Shot gladly; but the rest all perish'd there.\nProceeding thence, we sigh'd, and roamed the waves,\nGlad that we lived, but sorrowing for the slain.\nWe came to the Ææan isle; there dwelt", "source": "William Cowper, 1791", "ref": "Od. 10.133"}, "vatican-odyssey-landscapes-laestrygonians": {"book": 10, "line": 141, "text": "Our vessel there, noiseless, we push'd to land\nWithin a spacious haven, thither led\nBy some celestial Pow'r. We disembark'd,\nAnd on the coast two days and nights entire", "source": "William Cowper, 1791", "ref": "Od. 10.141"}, "oldham-waterhouse-circe-cup": {"book": 10, "line": 178, "text": "Behold a feast! and we have wine on board—\nPine not with needless famine! rise and eat.\nI spake; they readily obey'd, and each\nIssuing at my word abroad, beside", "source": "William Cowper, 1791", "ref": "Od. 10.178"}, "met-705224": {"book": 10, "line": 383, "text": "Or food, till he should see his prison'd friends\nOnce more at liberty? If then thy wish\nThat I should eat and drink be true, produce\nMy captive people; let us meet again.", "source": "William Cowper, 1791", "ref": "Od. 10.383"}, "met-248154": {"book": 10, "line": 400, "text": "Laertes' noble son, for wiles renown'd!\nHence to the shore, and to thy gallant bark;\nFirst, hale her safe aground, then, hiding all\nYour arms and treasures in the caverns, come", "source": "William Cowper, 1791", "ref": "Od. 10.400"}, "getty-odysseus-circe": {"book": 10, "line": 408, "text": "As when the calves within some village rear'd\nBehold, at eve, the herd returning home\nFrom fruitful meads where they have grazed their fill,\nNo longer in the stalls contain'd, they rush", "source": "William Cowper, 1791", "ref": "Od. 10.408"}, "aberdeen-swan-study-of-circe": {"book": 10, "line": 572, "text": "Our cheeks, meantime the Goddess to the shore\nDescending, bound within the bark a ram\nAnd sable ewe, passing us unperceived.\nFor who hath eyes that can discern a God", "source": "William Cowper, 1791", "ref": "Od. 10.572"}, "bnf-dolon-tiresias-krater": {"book": 11, "line": 51, "text": "Touch'd with compassion seeing him, I wept,\nAnd in wing'd accents brief him thus bespake.\nElpenor! how cam'st thou into the realms\nOf darkness? Hast thou, though on foot, so far", "source": "William Cowper, 1791", "ref": "Od. 11.51"}, "rijks-flaxman-elpenor-ghost": {"book": 11, "line": 71, "text": "In vengeance visit thee; but with my arms\n(What arms soe'er I left) burn me, and raise\nA kind memorial of me on the coast,\nHeap'd high with earth; that an unhappy man", "source": "William Cowper, 1791", "ref": "Od. 11.71"}, "wales-fuseli-teiresias": {"book": 11, "line": 138, "text": "Tiresias! thou, I doubt not, hast reveal'd\nThe ordinance of heav'n. But tell me, Seer!\nAnd truly. I behold my mother's shade;\nSilent she sits beside the blood, nor word", "source": "William Cowper, 1791", "ref": "Od. 11.138"}, "salviati-allori-tiresias": {"book": 11, "line": 152, "text": "Wing'd with affection, plaintive, thus began.\nMy son! how hast thou enter'd, still alive,\nThis darksome region? Difficult it is\nFor living man to view the realms of death.", "source": "William Cowper, 1791", "ref": "Od. 11.152"}, "boijmans-stradanus-hades": {"book": 11, "line": 186, "text": "Thy father dwells, nor to the city comes,\nFor aught; nor bed, nor furniture of bed,\nFurr'd cloaks or splendid arras he enjoys,\nBut, with his servile hinds all winter sleeps", "source": "William Cowper, 1791", "ref": "Od. 11.186"}, "aic-270366": {"book": 11, "line": 333, "text": "Areta iv'ry arm'd them thus bespake.\nPhæacians! how appears he in your eyes\nThis stranger, graceful as he is in port,\nIn stature noble, and in mind discrete?", "source": "William Cowper, 1791", "ref": "Od. 11.333"}, "rijks-thulden-odysseus-underworld": {"book": 11, "line": 486, "text": "Renown'd Ulysses! think not death a theme\nOf consolation; I had rather live\nThe servile hind for hire, and eat the bread\nOf some man scantily himself sustain'd,", "source": "William Cowper, 1791", "ref": "Od. 11.486"}, "odyssey-12-sirens-scylla-sun-cattle-plate-01-sirens": {"book": 12, "line": 71, "text": "Whelm'd under billows of the Deep, or, caught\nBy fiery tempests, sudden disappear.\nThose rocks the billow-cleaving bark alone\nThe Argo, further'd by the vows of all,", "source": "William Cowper, 1791", "ref": "Od. 12.71"}, "ferens-draper-ulysses-sirens": {"book": 12, "line": 150, "text": "Pleasant companion of our course, and we\n(The decks and benches clear'd) untoiling sat,\nWhile managed gales sped swift the bark along.\nThen, with dejected heart, thus I began.", "source": "William Cowper, 1791", "ref": "Od. 12.150"}, "israel-leontis-odysseus-sirens": {"book": 12, "line": 171, "text": "The billows slumber'd, lull'd by pow'r divine.\nUp-sprang my people, and the folded sails\nBestowing in the hold, sat to their oars,\nWhich with their polish'd blades whiten'd the Deep.", "source": "William Cowper, 1791", "ref": "Od. 12.171"}, "aic-5748": {"book": 12, "line": 198, "text": "Eurylochus and Perimedes sprang\nWith added cords to bind me still the more.\nThis danger past, and when the Sirens' voice,\nNow left remote, had lost its pow'r to charm,", "source": "William Cowper, 1791", "ref": "Od. 12.198"}, "aargauer-fuseli-scylla-charybdis": {"book": 12, "line": 209, "text": "Encouraged all, addressing thus my crew.\nWe meet not, now, my friends, our first distress.\nThis evil is not greater than we found\nWhen the huge Cyclops in his hollow den", "source": "William Cowper, 1791", "ref": "Od. 12.209"}, "getty-siren-ring": {"book": 12, "line": 234, "text": "I vigilant explored. Thus, many a groan\nHeaving, we navigated sad the streight,\nFor here stood Scylla, while Charybdis there\nWith hoarse throat deep absorb'd the briny flood.", "source": "William Cowper, 1791", "ref": "Od. 12.234"}, "getty-scylla-gem": {"book": 12, "line": 257, "text": "So Scylla them raised gasping to the rock,\nAnd at her cavern's mouth devour'd them loud-\nShrieking, and stretching forth to me their arms\nIn sign of hopeless mis'ry. Ne'er beheld", "source": "William Cowper, 1791", "ref": "Od. 12.257"}, "boijmans-stradanus-cattle-helios": {"book": 12, "line": 277, "text": "Pass the isle, therefore, scudding swift away.\nI ceased; they me with consternation heard,\nAnd harshly thus Eurylochus replied.\nUlysses, ruthless Chief! no toils impair", "source": "William Cowper, 1791", "ref": "Od. 12.277"}, "rijks-thulden-cattle-of-helios": {"book": 12, "line": 400, "text": "The storm then ceased to rage, and we, again\nEmbarking, launch'd our galley, rear'd the mast,\nAnd gave our unfurl'd canvas to the wind.\nThe island left afar, and other land", "source": "William Cowper, 1791", "ref": "Od. 12.400"}, "odyssey-12-sirens-scylla-sun-cattle-plate-08-zeus": {"book": 12, "line": 411, "text": "His scull together; he a diver's plunge\nMade downward, and his noble spirit fled.\nMeantime, Jove thund'ring, hurl'd into the ship\nHis bolts; she, smitten by the fires of Jove,", "source": "William Cowper, 1791", "ref": "Od. 12.411"}, "bm-bromley-scylla-charybdis": {"book": 12, "line": 451, "text": "And assiduity, my strength revived.\nBut wherefore this? ye have already learn'd\nThat hist'ry, thou and thy illustrious spouse;\nI told it yesterday, and hate a tale", "source": "William Cowper, 1791", "ref": "Od. 12.451"}, "cooperhewitt-giani-return-ulysses": {"book": 13, "line": 3, "text": "Charm'd into ecstacy with his discourse\nThroughout the twilight hall. Then, thus the King.\nUlysses, since beneath my brazen dome\nSublime thou hast arrived, like woes, I trust,", "source": "William Cowper, 1791", "ref": "Od. 13.3"}, "vanthulden-leave-of-alcinous": {"book": 13, "line": 46, "text": "All safe, my spotless consort and my friends!\nMay ye, whom here I leave, gladden your wives\nAnd see your children blest, and may the pow'rs\nImmortal with all good enrich you all,", "source": "William Cowper, 1791", "ref": "Od. 13.46"}, "louvre-lorrain-departure-phaeacians": {"book": 13, "line": 90, "text": "Though sleeping now serenely, and resign'd\nTo sweet oblivion of all sorrow past.\nThe brightest star of heav'n, precursor chief\nOf day-spring, now arose, when at the isle", "source": "William Cowper, 1791", "ref": "Od. 13.90"}, "odyssey-13-return-to-ithaca-plate-01-ithaka": {"book": 13, "line": 101, "text": "The Naiads. In that cave beakers of stone\nAnd jars are seen; bees lodge their honey there;\nAnd there, on slender spindles of the rock\nThe nymphs of rivers weave their wond'rous robes.", "source": "William Cowper, 1791", "ref": "Od. 13.101"}, "leipzig-preller-arrival-ithaca": {"book": 13, "line": 117, "text": "They heap'd, without the road, lest, while he slept\nSome passing traveller should rifle them.\nThen homeward thence they sped. Nor Ocean's God\nHis threats forgot denounced against divine", "source": "William Cowper, 1791", "ref": "Od. 13.117"}, "vanthulden-phaeacians-sleeping-odysseus": {"book": 13, "line": 184, "text": "The Ocean's God. Meantime, Ulysses woke,\nUnconscious where; stretch'd on his native soil\nHe lay, and knew it not, long-time exiled.\nFor Pallas, progeny of Jove, a cloud", "source": "William Cowper, 1791", "ref": "Od. 13.184"}, "aic-50284": {"book": 13, "line": 218, "text": "His native isle, with pensive steps and slow\nPacing the border of the billowy flood,\nForlorn; but while he wept, Pallas approach'd,\nIn form a shepherd stripling, girlish fair", "source": "William Cowper, 1791", "ref": "Od. 13.218"}, "malaspina-bottani-athena-ithaca": {"book": 13, "line": 252, "text": "For guile, in him, stood never at a pause.\nO'er yonder flood, even in spacious Crete\nI heard of Ithaca, where now, it seems,\nI have, myself, with these my stores arrived;", "source": "William Cowper, 1791", "ref": "Od. 13.252"}, "pinakothek-poorter-trojan-spoils": {"book": 13, "line": 358, "text": "To see you more, whom yet with happy vows\nI now can hail again. Gifts, as of old,\nWe will hereafter at your shrines present,\nIf Jove-born Pallas, huntress of the spoils,", "source": "William Cowper, 1791", "ref": "Od. 13.358"}, "malaspina-bottani-odysseus-beggar": {"book": 13, "line": 369, "text": "All his stores into it, the gold, the brass,\nAnd robes magnificent, his gifts received\nFrom the Phæacians; safe he lodg'd them all,\nAnd Pallas, daughter of Jove Ægis-arm'd,", "source": "William Cowper, 1791", "ref": "Od. 13.369"}, "vanthulden-odysseus-beggar-at-door": {"book": 14, "line": 48, "text": "Both who thou art, and all that thou hast borne.\nSo saying, the gen'rous swine-herd introduced\nUlysses, and thick bundles spread of twigs\nBeneath him, cover'd with the shaggy skin", "source": "William Cowper, 1791", "ref": "Od. 14.48"}, "plantin-odysseus-eumaeus": {"book": 14, "line": 119, "text": "Thou say'st he perish'd for the glory-sake\nOf Agamemnon. Name him; I, perchance,\nMay have beheld the Hero. None can say\nBut Jove and the inhabitants of heav'n", "source": "William Cowper, 1791", "ref": "Od. 14.119"}, "rijks-telemachus-palace-menelaus": {"book": 15, "line": 230, "text": "Neleus by force possess'd a year complete.\nMeantime, Melampus in the house endured\nOf Phylacus imprisonment and woe,\nAnd burn'd with wrath for Neleus' daughter sake", "source": "William Cowper, 1791", "ref": "Od. 15.230"}, "nm-jordaens-theoclymenus": {"book": 15, "line": 298, "text": "To sacred Elis where the Epeans rule,\nAnd through the sharp Echinades he next\nSteer'd her, uncertain whether fate ordain'd\nHis life or death, surprizal or escape.", "source": "William Cowper, 1791", "ref": "Od. 15.298"}, "leipzig-preller-at-eumaeus": {"book": 15, "line": 555, "text": "The hawsers, forth they push'd into the Deep\nAnd sought the city, while with nimble pace\nProceeding thence, Telemachus attain'd\nThe cottage soon where good Eumæus slept,", "source": "William Cowper, 1791", "ref": "Od. 15.555"}, "met-437467": {"book": 16, "line": 160, "text": "His sandals, to the city bent his way.\nNor went Eumæus from his home unmark'd\nBy Pallas, who in semblance of a fair\nDamsel, accomplish'd in domestic arts,", "source": "William Cowper, 1791", "ref": "Od. 16.160"}, "rijks-thulden-eumaeus-telemachus": {"book": 16, "line": 187, "text": "Nor are thy cloaths, nor is thy port the same.\nThou art a God, I know, and dwell'st in heav'n.\nOh, smile on us, that we may yield thee rites\nAcceptable, and present thee golden gifts", "source": "William Cowper, 1791", "ref": "Od. 16.187"}, "rijks-monnet-telemachus-odysseus-reunited": {"book": 16, "line": 214, "text": "Now young again, and clad in fresh attire.\nThe Gods who dwell in yonder heav'n, with ease\nDignify or debase a mortal man.\nSo saying, he sat. Then threw Telemachus", "source": "William Cowper, 1791", "ref": "Od. 16.214"}, "odyssey-16-father-and-son-plate-03-ulysses-telemachus": {"book": 16, "line": 321, "text": "Hereafter, if in truth by signs from heav'n\nInform'd, thou hast been taught the will of Jove.\nThus they conferr'd. The gallant bark, meantime,\nReach'd Ithaca, which from the Pylian shore", "source": "William Cowper, 1791", "ref": "Od. 16.321"}, "aic-462": {"book": 17, "line": 287, "text": "But, to suppress the appetite, I deem\nImpossible; the stomach is a source\nOf ills to man, an avaricious gulph\nDestructive, which to satiate, ships are rigg'd,", "source": "William Cowper, 1791", "ref": "Od. 17.287"}, "flaxman-ulysses-and-his-dog-argus": {"book": 17, "line": 298, "text": "Much ordure left, with which Ulysses' hinds\nShould, in due time, manure his spacious fields.\nThere lay, with dog-devouring vermin foul\nAll over, Argus; soon as he perceived", "source": "William Cowper, 1791", "ref": "Od. 17.298"}, "odyssey-17-palace-beggar-plate-02-argos-utting": {"book": 17, "line": 308, "text": "He is, past doubt, but whether he hath been\nAs fleet as fair I know not; rather such\nPerchance as masters sometimes keep to grace\nTheir tables, nourish'd more for shew than use.", "source": "William Cowper, 1791", "ref": "Od. 17.308"}, "vanthulden-argus-recognizes-odysseus": {"book": 17, "line": 336, "text": "The palace, like a squalid beggar old,\nStaff-propp'd, and in loose tatters foul attired.\nWithin the portal on the ashen sill\nHe sat, and, seeming languid, lean'd against", "source": "William Cowper, 1791", "ref": "Od. 17.336"}, "rijks-thulden-alms-from-servant": {"book": 17, "line": 489, "text": "But in his heart Telemachus that blow\nResented, anguish-torn, yet not a tear\nHe shed, but silent shook his brows, and mused\nTerrible things. Penelope, meantime,", "source": "William Cowper, 1791", "ref": "Od. 17.489"}, "vanthulden-fight-odysseus-irus": {"book": 18, "line": 90, "text": "Then doubtful stood Ulysses toil-inured,\nWhether to strike him lifeless to the earth\nAt once, or fell him with a managed blow.\nTo smite with managed force at length he chose", "source": "William Cowper, 1791", "ref": "Od. 18.90"}, "ngprague-byss-penelope-and-suitors": {"book": 18, "line": 275, "text": "And more important far, himself intent.\nThen thus Antinoüs, Eupithes' son.\nIcarius' daughter wise! only accept\nSuch gifts as we shall bring, for gifts demand", "source": "William Cowper, 1791", "ref": "Od. 18.275"}, "louvre-melian-relief-ca860": {"book": 19, "line": 55, "text": "Her women planted her accustom'd seat\nWith silver wreathed and ivory. That throne\nIcmalius made, artist renown'd, and join'd\nA footstool to its splendid frame beneath,", "source": "William Cowper, 1791", "ref": "Od. 19.55"}, "odyssey-19-penelope-and-the-scar-plate-02-poynter-eurycleia": {"book": 19, "line": 369, "text": "So many thighs of fatted victims burn'd,\nAnd chosen hecatombs produced as thou\nTo Jove the Thund'rer, him entreating still\nThat he would grant thee a serene old age,", "source": "William Cowper, 1791", "ref": "Od. 19.369"}, "odyssey-19-penelope-and-the-scar-plate-01-eurycleia": {"book": 19, "line": 434, "text": "Sons of Autolycus, to chase the boar.\nArrived at the Parnassian mount, they climb'd\nHis bushy sides, and to his airy heights\nEre long attain'd. It was the pleasant hour", "source": "William Cowper, 1791", "ref": "Od. 19.434"}, "ng-pinturicchio-penelope": {"book": 19, "line": 505, "text": "That needless task. I can distinguish well\nMyself, between them, and shall know them all;\nBut hold thy peace. Hush! leave it with the Gods.\nSo he; then went the ancient matron forth,", "source": "William Cowper, 1791", "ref": "Od. 19.505"}, "vanthulden-minerva-urges-bow": {"book": 19, "line": 556, "text": "An anxious look around, and saw my geese\nBeside their tray, all feeding as before.\nHer then Ulysses answer'd, ever-wise.\nO Queen! it is not possible to miss", "source": "William Cowper, 1791", "ref": "Od. 19.556"}, "cleveland-lemonnier-penelope-1996-286": {"book": 19, "line": 602, "text": "So saying, she to her splendid chamber thence\nRetired, not sole, but by her female train\nAttended; there arrived, she wept her spouse,\nHer lov'd Ulysses, till Minerva dropp'd", "source": "William Cowper, 1791", "ref": "Od. 19.602"}, "aic-164": {"book": 20, "line": 103, "text": "Such pray'r he made, and Jove omniscient heard.\nSudden he thunder'd from the radiant heights\nOlympian; glad, Ulysses heard the sound.\nA woman, next, a labourer at the mill", "source": "William Cowper, 1791", "ref": "Od. 20.103"}, "bm-cromek-penelope-bow": {"book": 21, "line": 3, "text": "Prompted Icarius' daughter, the discrete\nPenelope, with bow and rings to prove\nHer suitors in Ulysses' courts, a game\nTerrible in conclusion to them all.", "source": "William Cowper, 1791", "ref": "Od. 21.3"}, "met-252388": {"book": 21, "line": 120, "text": "Successful as my sire, the prize away.\nSo saying, he started from his seat, cast off\nHis purple cloak, and lay'd his sword aside,\nThen fix'd, himself, the rings, furrowing the earth", "source": "William Cowper, 1791", "ref": "Od. 21.120"}, "rijks-thulden-weapons-to-eumaeus": {"book": 21, "line": 190, "text": "Antinoüs, and Eurymachus the brave.\nThen went the herdsman and the swine-herd forth\nTogether; after whom, the glorious Chief\nHimself the house left also, and when all", "source": "William Cowper, 1791", "ref": "Od. 21.190"}, "vanthulden-arrow-twelve-axes": {"book": 21, "line": 420, "text": "To be, ere long, experienced. True he lodg'd\nThe arrow on the centre of the bow,\nAnd, occupying still his seat, drew home\nNerve and notch'd arrow-head; with stedfast sight", "source": "William Cowper, 1791", "ref": "Od. 21.420"}, "berlin-suitors-skyphos-f2588": {"book": 22, "line": 3, "text": "With bow and full-charged quiver to the door;\nLoose on the broad stone at his feet he pour'd\nHis arrows, and the suitors, thus, bespake.\nThis prize, though difficult, hath been atchieved.", "source": "William Cowper, 1791", "ref": "Od. 22.3"}, "berlinische-corinth-suitors-fight": {"book": 22, "line": 200, "text": "So saying, he left him in his dreadful sling.\nThen, arming both, and barring fast the door,\nThey sought brave Laertiades again.\nAnd now, courageous at the portal stood", "source": "William Cowper, 1791", "ref": "Od. 22.200"}, "berlinische-corinth-odysseus-suitors": {"book": 22, "line": 256, "text": "Together; but Minerva gave them all\nA devious flight; one struck a column, one\nThe planks of the broad portal, and a third\nFlung right his ashen beam pond'rous with brass", "source": "William Cowper, 1791", "ref": "Od. 22.256"}, "aic-77260": {"book": 22, "line": 307, "text": "Strike, seize, and slay, resistance or escape\nIs none, the fowler's heart leaps with delight,\nSo they, pursuing through the spacious hall\nThe suitors, smote them on all sides, their heads", "source": "William Cowper, 1791", "ref": "Od. 22.307"}, "rijks-thulden-slaying-suitors": {"book": 22, "line": 345, "text": "I clasp thy knees, Ulysses! oh respect\nMy suit, and spare me. Thou shalt not escape\nRegret thyself hereafter, if thou slay\nMe, charmer of the woes of Gods and men.", "source": "William Cowper, 1791", "ref": "Od. 22.345"}, "mmfa-monsiau-suitors": {"book": 22, "line": 441, "text": "The seats and tables; when ye shall have thus\nSet all in order, lead those women forth,\nAnd in the centre of the spacious court,\nBetween the scull'ry and the outer-wall", "source": "William Cowper, 1791", "ref": "Od. 22.441"}, "odyssey-23-penelope-test-plate-02-tischbein-odysseus-penelope": {"book": 23, "line": 93, "text": "My mother! ah my hapless and my most\nObdurate mother! wherefore thus aloof\nShunn'st thou my father, neither at his side\nSitting affectionate, nor utt'ring word?", "source": "William Cowper, 1791", "ref": "Od. 23.93"}, "met-359855": {"book": 23, "line": 170, "text": "As hurries me at once into thy arms,\nThough my remembrance perfectly retains,\nSuch as he was, Ulysses, when he sail'd\nOn board his bark from Ithaca—Go, nurse,", "source": "William Cowper, 1791", "ref": "Od. 23.170"}, "rijks-thulden-toward-the-bed": {"book": 23, "line": 239, "text": "Night's almost finish'd course, and held, meantime,\nThe golden dawn close pris'ner in the Deep,\nForbidding her to lead her coursers forth,\nLampus and Phaëton that furnish light", "source": "William Cowper, 1791", "ref": "Od. 23.239"}, "met-253053": {"book": 23, "line": 287, "text": "The chambers appertain'd, and with a torch\nConducted them to rest; she introduced\nThe happy pair, and went; transported they\nTo rites connubial intermitted long,", "source": "William Cowper, 1791", "ref": "Od. 23.287"}, "met-251812": {"book": 23, "line": 344, "text": "And with sweet sleep, at once from Ocean rous'd\nThe golden-axled chariot of the morn\nTo illumine earth. Then from his fleecy couch\nThe Hero sprang, and thus his spouse enjoined.", "source": "William Cowper, 1791", "ref": "Od. 23.344"}, "vanthulden-way-to-laertes": {"book": 24, "line": 213, "text": "Meantime, descending from the city-gates,\nUlysses, by his son and by his swains\nFollow'd, arrived at the delightful farm\nWhich old Laertes had with strenuous toil", "source": "William Cowper, 1791", "ref": "Od. 24.213"}, "getty-penelope-weaving": {"book": 24, "line": 334, "text": "Then answer thus Laertes quick return'd.\nIf thou hast come again, and art indeed\nMy son Ulysses, give me then the proof\nIndubitable, that I may believe.", "source": "William Cowper, 1791", "ref": "Od. 24.334"}, "vanthulden-embraces-laertes": {"book": 24, "line": 469, "text": "Eupithes' counsel rather; all at once\nTo arms they flew, and clad in dazzling brass\nBefore the city form'd their dense array.\nLeader infatuate at their head appear'd", "source": "William Cowper, 1791", "ref": "Od. 24.469"}, "cooperhewitt-giani-minerva-peace": {"book": 24, "line": 546, "text": "So Pallas, whom Ulysses, glad, obey'd.\nThen faithful covenants of peace between\nBoth sides ensued, ratified in the sight\nOf Pallas progeny of Jove, who seem'd,", "source": "William Cowper, 1791", "ref": "Od. 24.546"}}};
